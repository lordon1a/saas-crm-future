<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super Admin Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50">
    <!-- Header -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-10">
        <div class="max-w-7xl mx-auto px-6 py-4 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-purple-600 rounded-lg flex items-center justify-center">
                    <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path>
                    </svg>
                </div>
                <div>
                    <h1 class="text-lg font-bold text-slate-900">Super Admin</h1>
                    <p class="text-xs text-slate-500" id="userEmail"></p>
                </div>
            </div>
            <button onclick="logout()" class="px-4 py-2 text-sm text-slate-600 hover:text-slate-900 font-medium">
                Logout
            </button>
        </div>
    </header>

    <div class="max-w-7xl mx-auto px-6 py-8">
        <!-- Stats Cards -->
        <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-8">
            <div class="bg-white rounded-xl border border-slate-200 p-6">
                <div class="flex items-center justify-between mb-2">
                    <span class="text-sm text-slate-500">Total Workspaces</span>
                    <svg class="w-5 h-5 text-purple-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"></path>
                    </svg>
                </div>
                <p class="text-3xl font-bold text-slate-900" id="totalWorkspaces">-</p>
            </div>

            <div class="bg-white rounded-xl border border-slate-200 p-6">
                <div class="flex items-center justify-between mb-2">
                    <span class="text-sm text-slate-500">DAU</span>
                    <svg class="w-5 h-5 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"></path>
                    </svg>
                </div>
                <p class="text-3xl font-bold text-slate-900" id="dau">-</p>
            </div>

            <div class="bg-white rounded-xl border border-slate-200 p-6">
                <div class="flex items-center justify-between mb-2">
                    <span class="text-sm text-slate-500">MAU</span>
                    <svg class="w-5 h-5 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"></path>
                    </svg>
                </div>
                <p class="text-3xl font-bold text-slate-900" id="mau">-</p>
            </div>

            <div class="bg-white rounded-xl border border-slate-200 p-6">
                <div class="flex items-center justify-between mb-2">
                    <span class="text-sm text-slate-500">Messages (30d)</span>
                    <svg class="w-5 h-5 text-amber-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z"></path>
                    </svg>
                </div>
                <p class="text-3xl font-bold text-slate-900" id="messages30d">-</p>
            </div>
        </div>

        <!-- Tenants Table -->
        <div class="bg-white rounded-xl border border-slate-200">
            <div class="px-6 py-4 border-b border-slate-200 flex items-center justify-between">
                <h2 class="text-lg font-bold text-slate-900">Workspaces</h2>
                <button onclick="loadTenants()" class="text-sm text-purple-600 hover:text-purple-700 font-medium">
                    Refresh
                </button>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full">
                    <thead class="bg-slate-50 border-b border-slate-200">
                        <tr>
                            <th class="px-6 py-3 text-left text-xs font-semibold text-slate-600 uppercase">ID</th>
                            <th class="px-6 py-3 text-left text-xs font-semibold text-slate-600 uppercase">Company</th>
                            <th class="px-6 py-3 text-left text-xs font-semibold text-slate-600 uppercase">Created</th>
                            <th class="px-6 py-3 text-left text-xs font-semibold text-slate-600 uppercase">Users</th>
                            <th class="px-6 py-3 text-left text-xs font-semibold text-slate-600 uppercase">Customers</th>
                            <th class="px-6 py-3 text-left text-xs font-semibold text-slate-600 uppercase">Messages</th>
                            <th class="px-6 py-3 text-left text-xs font-semibold text-slate-600 uppercase">Status</th>
                            <th class="px-6 py-3 text-right text-xs font-semibold text-slate-600 uppercase">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="tenantsTable" class="divide-y divide-slate-200">
                        <tr>
                            <td colspan="8" class="px-6 py-12 text-center text-slate-500">
                                Loading...
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="static/admin.js"></script>
    <script>
        checkAuth();
        
        const user = JSON.parse(localStorage.getItem('super_admin_user'));
        document.getElementById('userEmail').textContent = user.email;
        
        loadAnalytics();
        loadTenants();
        
        async function loadAnalytics() {
            try {
                const data = await apiCall('/analytics/overview');
                
                document.getElementById('totalWorkspaces').textContent = data.platform.total_workspaces;
                document.getElementById('dau').textContent = data.activity.dau;
                document.getElementById('mau').textContent = data.activity.mau;
                document.getElementById('messages30d').textContent = data.activity.messages_30d.toLocaleString();
            } catch (error) {
                console.error('Failed to load analytics:', error);
            }
        }
        
        async function loadTenants() {
            try {
                const data = await apiCall('/tenants');
                const tbody = document.getElementById('tenantsTable');
                
                if (data.tenants.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="8" class="px-6 py-12 text-center text-slate-500">No workspaces found</td></tr>';
                    return;
                }
                
                tbody.innerHTML = data.tenants.map(tenant => `
                    <tr class="hover:bg-slate-50">
                        <td class="px-6 py-4 text-sm text-slate-900">${tenant.id}</td>
                        <td class="px-6 py-4 text-sm font-medium text-slate-900">${tenant.company_name}</td>
                        <td class="px-6 py-4 text-sm text-slate-600">${new Date(tenant.created_at).toLocaleDateString()}</td>
                        <td class="px-6 py-4 text-sm text-slate-600">${tenant.stats.users}</td>
                        <td class="px-6 py-4 text-sm text-slate-600">${tenant.stats.customers}</td>
                        <td class="px-6 py-4 text-sm text-slate-600">${tenant.stats.messages_30d}</td>
                        <td class="px-6 py-4">
                            <span class="px-2 py-1 text-xs font-semibold rounded-full ${tenant.whatsapp_connected ? 'bg-green-100 text-green-700' : 'bg-slate-100 text-slate-600'}">
                                ${tenant.whatsapp_connected ? 'Active' : 'Inactive'}
                            </span>
                        </td>
                        <td class="px-6 py-4 text-right">
                            <a href="tenant.html?id=${tenant.id}" class="text-sm text-purple-600 hover:text-purple-700 font-medium">
                                View Details →
                            </a>
                        </td>
                    </tr>
                `).join('');
            } catch (error) {
                console.error('Failed to load tenants:', error);
                document.getElementById('tenantsTable').innerHTML = '<tr><td colspan="8" class="px-6 py-12 text-center text-red-500">Failed to load workspaces</td></tr>';
            }
        }
    </script>
</body>
</html>

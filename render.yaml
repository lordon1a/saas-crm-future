services:
  - type: web
    name: whatsapp-crm-saas
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --worker-class geventwebsocket.gunicorn.workers.GeventWebSocketWorker -w 1 --timeout 120 app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9

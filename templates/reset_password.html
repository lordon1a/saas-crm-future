<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <script src="{{ url_for('static', filename='csrf-protection.js') }}"></script>
    <title>Şifre Sıfırla - WhatsApp CRM</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50">
    <div class="min-h-screen flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
        <div class="max-w-md w-full space-y-8">
            <div>
                <h2 class="mt-6 text-center text-3xl font-extrabold text-gray-900">
                    Yeni Şifre Belirle
                </h2>
                {% if user %}
                <p class="mt-2 text-center text-sm text-gray-600">
                    {{ user.name }} için yeni şifre oluşturun
                </p>
                {% endif %}
            </div>

            {% if error %}
            <div class="rounded-md bg-red-50 p-4">
                <div class="flex">
                    <div class="flex-shrink-0">
                        <svg class="h-5 w-5 text-red-400" viewBox="0 0 20 20" fill="currentColor">
                            <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z" clip-rule="evenodd"/>
                        </svg>
                    </div>
                    <div class="ml-3">
                        <p class="text-sm font-medium text-red-800">{{ error }}</p>
                    </div>
                </div>
            </div>
            <div class="text-center">
                <a href="/forgot-password" class="font-medium text-indigo-600 hover:text-indigo-500">
                    Yeni sıfırlama linki iste
                </a>
            </div>
            {% else %}
            
            <div id="errorMessage" class="hidden rounded-md bg-red-50 p-4">
                <div class="flex">
                    <div class="flex-shrink-0">
                        <svg class="h-5 w-5 text-red-400" viewBox="0 0 20 20" fill="currentColor">
                            <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z" clip-rule="evenodd"/>
                        </svg>
                    </div>
                    <div class="ml-3">
                        <p class="text-sm font-medium text-red-800" id="errorText"></p>
                    </div>
                </div>
            </div>

            <form id="resetPasswordForm" class="mt-8 space-y-6">
                <input type="hidden" name="token" value="{{ token }}">
                
                <div class="rounded-md shadow-sm space-y-4">
                    <div>
                        <label for="password" class="block text-sm font-medium text-gray-700">Yeni Şifre</label>
                        <input id="password" name="password" type="password" required 
                               class="mt-1 appearance-none rounded-md relative block w-full px-3 py-2 border border-gray-300 placeholder-gray-500 text-gray-900 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 focus:z-10 sm:text-sm" 
                               placeholder="En az 8 karakter"
                               minlength="8">
                        <p class="mt-1 text-xs text-gray-500">Şifreniz en az 8 karakter olmalıdır</p>
                    </div>
                    
                    <div>
                        <label for="confirmPassword" class="block text-sm font-medium text-gray-700">Şifre Tekrar</label>
                        <input id="confirmPassword" name="confirmPassword" type="password" required 
                               class="mt-1 appearance-none rounded-md relative block w-full px-3 py-2 border border-gray-300 placeholder-gray-500 text-gray-900 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 focus:z-10 sm:text-sm" 
                               placeholder="Şifrenizi tekrar girin"
                               minlength="8">
                    </div>
                </div>

                <div>
                    <button type="submit" id="submitBtn"
                            class="group relative w-full flex justify-center py-2 px-4 border border-transparent text-sm font-medium rounded-md text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500">
                        Şifreyi Değiştir
                    </button>
                </div>

                <div class="text-center">
                    <a href="/login" class="font-medium text-indigo-600 hover:text-indigo-500">
                        Giriş sayfasına dön
                    </a>
                </div>
            </form>
            {% endif %}
        </div>
    </div>

    {% if not error %}
    <script>
        document.getElementById('resetPasswordForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const token = document.querySelector('input[name="token"]').value;
            const submitBtn = document.getElementById('submitBtn');
            const errorDiv = document.getElementById('errorMessage');
            
            // Hide error
            errorDiv.classList.add('hidden');
            
            // Validate passwords match
            if (password !== confirmPassword) {
                document.getElementById('errorText').textContent = 'Şifreler eşleşmiyor';
                errorDiv.classList.remove('hidden');
                return;
            }
            
            // Validate password length
            if (password.length < 8) {
                document.getElementById('errorText').textContent = 'Şifre en az 8 karakter olmalıdır';
                errorDiv.classList.remove('hidden');
                return;
            }
            
            // Disable button
            submitBtn.disabled = true;
            submitBtn.textContent = 'Değiştiriliyor...';
            
            try {
                const response = await fetch('/reset-password', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ token, password })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    // Success - redirect to login
                    alert(data.message);
                    window.location.href = data.redirect || '/login';
                } else {
                    document.getElementById('errorText').textContent = data.error || 'Bir hata oluştu';
                    errorDiv.classList.remove('hidden');
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Şifreyi Değiştir';
                }
            } catch (error) {
                document.getElementById('errorText').textContent = 'Bağlantı hatası oluştu';
                errorDiv.classList.remove('hidden');
                submitBtn.disabled = false;
                submitBtn.textContent = 'Şifreyi Değiştir';
            }
        });
    </script>
    {% endif %}
</body>
</html>

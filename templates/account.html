    <style>
        body {
            background: #f8f7ff;

        .tab-active {

        .input-field {
            width: 100%;
            padding: .65rem 1rem;
            border-radius: .75rem;
            border: 1px solid #e2e8f0;
            font-size: .925rem;
            outline: none;
            transition: all .15s;
            background: #fff;
        }

        .input-field:focus {
            border-color: #8b5cf6;
            box-shadow: 0 0 0 3px rgba(139, 92, 246, .15);
        }

        .btn-primary {
            background: linear-gradient(135deg, #7c3aed, #6d28d9);
            color: #fff;
            padding: .65rem 1.75rem;
            border-radius: .75rem;
            font-weight: 600;
            font-size: .9rem;
            cursor: pointer;
            border: none;
            transition: all .2s;
            box-shadow: 0 4px 12px rgba(124, 58, 237, .3);
        }

        .btn-primary:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 18px rgba(124, 58, 237, .38);
        }

        .btn-primary:disabled {
            opacity: .55;
            cursor: not-allowed;
            transform: none;
        }

        .btn-secondary {
            background: #fff;
            color: #374151;
            border: 1px solid #e2e8f0;
            padding: .65rem 1.75rem;
            border-radius: .75rem;
            font-weight: 600;
            font-size: .9rem;
            cursor: pointer;
            transition: all .2s;
        }

        .btn-secondary:hover {
            background: #f8f7ff;
            border-color: #c4b5fd;
        }

        #toast {
            transition: opacity .3s, transform .3s;
        }
    </style>
</head>

                    class="relative w-10 h-10 flex items-center justify-center text-slate-400 hover:text-slate-600 hover:bg-slate-50 rounded-xl transition-all duration-300"

                <a href="/account"

                    title="Profil">

        <!-- Main -->
                <header class="bg-white border-b border-gray-200 px-4 md:px-8 py-3 flex-shrink-0">
            <div class="grid grid-cols-1 lg:grid-cols-[220px_minmax(420px,1fr)_360px] items-center gap-3 md:gap-4">
                <div class="hidden lg:block"></div>
                <div class="relative w-full max-w-3xl justify-self-center">
                    <i class="fas fa-search absolute left-3.5 top-1/2 -translate-y-1/2 text-gray-400 text-sm"></i>
                    <input type="text" data-topbar-search placeholder="Pipedrive'da ara" class="w-full pl-10 pr-4 py-2.5 bg-white border border-gray-300 rounded-full text-sm focus:outline-none focus:ring-2 focus:ring-brand-500/20 focus:border-brand-500 transition-all">
                </div>
                <div class="flex items-center gap-1.5 md:gap-2 justify-self-end">
                    <button class="hidden md:flex w-9 h-9 rounded-full text-gray-500 hover:bg-gray-100 transition-all items-center justify-center" title="Hediye">
                        <i class="fas fa-gift text-sm"></i>

                    <button class="hidden md:flex w-9 h-9 rounded-full text-gray-500 hover:bg-gray-100 transition-all items-center justify-center" title="Yardim">
                        <i class="fas fa-circle-question text-sm"></i>
                    </button>
                    <button class="hidden md:flex w-9 h-9 rounded-full text-gray-500 hover:bg-gray-100 transition-all items-center justify-center" title="Ipuclari">

                    <div class="relative">
                        <button data-topbar-menu-button class="h-10 pl-2.5 pr-2 rounded-full border border-gray-300 bg-white hover:bg-gray-50 transition-all flex items-center gap-2">
                            <div data-topbar-avatar class="w-7 h-7 rounded-full bg-slate-200 text-slate-700 text-xs font-bold flex items-center justify-center">YG</div>
                            <span data-topbar-name class="hidden md:block text-xs font-semibold text-gray-700 max-w-[80px] truncate">Yigit</span>
                            <i class="fas fa-chevron-down text-[10px] text-gray-500"></i>
                        </button>
                        <div data-topbar-menu class="hidden absolute right-0 top-12 w-72 bg-white border border-gray-200 rounded-xl shadow-xl py-2 z-50">
                            <div data-topbar-menu-content></div>
                        </div>

                </div>
            </div>
        </header>
            <header class="sticky top-0 bg-white border-b border-slate-100 px-8 py-4 flex items-center gap-4 z-10">
                <a href="/"
                    class="w-8 h-8 rounded-xl flex items-center justify-center text-slate-400 hover:bg-slate-50 hover:text-slate-600 transition-all">
                    <i class="fas fa-arrow-left text-sm"></i>
                </a>
                <div>
                    <h1 class="text-lg font-bold text-slate-800">Hesabım</h1>
                    <p class="text-xs text-slate-400">Profil bilgileri ve güvenlik ayarları</p>
                </div>
            </header>

            <div class="max-w-2xl mx-auto p-8">

                <!-- Avatar Kartı -->
                <div class="bg-white rounded-2xl border border-slate-100 shadow-sm p-6 mb-6 flex items-center gap-5">
                    <div class="relative group">
                        <div id="bigAvatar"
                            class="w-20 h-20 rounded-2xl bg-gradient-to-br from-brand-500 to-brand-700 flex items-center justify-center text-white text-3xl font-extrabold shadow-lg select-none">
                            ?</div>
                    </div>
                    <div>
                        <div id="avatarName" class="text-xl font-bold text-slate-800">—</div>
                        <div id="avatarEmail" class="text-sm text-slate-400 mt-0.5">—</div>
                        <div id="avatarRole"
                            class="mt-1.5 inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-bold bg-brand-50 text-brand-700 capitalize">
                            —</div>
                    </div>
                </div>

                <!-- Sekmeler -->
                <div class="flex gap-6 border-b border-slate-100 mb-6 text-sm font-semibold text-slate-400">
                    <button onclick="switchTab('profile')" id="tabProfile" class="pb-3 tab-active">Profil
                        Bilgileri</button>
                    <button onclick="switchTab('security')" id="tabSecurity"
                        class="pb-3 hover:text-slate-600 transition-colors">Güvenlik</button>
                </div>

                <!-- ── Profil Sekmesi ── -->
                <div id="panelProfile">
                    <div class="bg-white rounded-2xl border border-slate-100 shadow-sm p-6 space-y-5">
                        <div>
                            <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-1.5">Ad
                                Soyad</label>
                            <input id="profileName" type="text" class="input-field" placeholder="Adınız Soyadınız">
                        </div>
                        <div>
                            <label
                                class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-1.5">E-posta</label>
                            <input id="profileEmail" type="email" class="input-field" placeholder="e-posta@sirket.com">
                            <p class="text-xs text-slate-400 mt-1.5 flex items-center gap-1">
                                <i class="fas fa-info-circle"></i>
                                E-postanızı değiştirirseniz tekrar giriş yapmanız gerekebilir.
                            </p>
                        </div>
                        <div class="flex justify-end gap-3 pt-2">
                            <button class="btn-secondary" onclick="loadProfile()">İptal</button>
                            <button class="btn-primary" id="saveProfileBtn" onclick="saveProfile()">
                                <i class="fas fa-save mr-1.5"></i>Kaydet
                            </button>
                        </div>
                    </div>
                </div>

                <!-- ── Güvenlik Sekmesi ── -->
                <div id="panelSecurity" class="hidden">
                    <div class="bg-white rounded-2xl border border-slate-100 shadow-sm p-6 space-y-5">
                        <div>
                            <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-1.5">Mevcut
                                �?ifre</label>
                            <div class="relative">
                                <input id="currentPw" type="password" class="input-field pr-10" placeholder="••••••••">
                                <button
                                    class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600"
                                    onclick="togglePw('currentPw', this)">
                                    <i class="fas fa-eye text-sm"></i>
                                </button>
                            </div>
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-1.5">Yeni
                                �?ifre</label>
                            <div class="relative">
                                <input id="newPw" type="password" class="input-field pr-10"
                                    placeholder="En az 8 karakter" oninput="checkStrength()">
                                <button
                                    class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600"
                                    onclick="togglePw('newPw', this)">
                                    <i class="fas fa-eye text-sm"></i>
                                </button>
                            </div>
                            <!-- Strength bar -->
                            <div class="mt-2 h-1.5 bg-slate-100 rounded-full overflow-hidden">
                                <div id="strengthBar" class="h-full rounded-full transition-all duration-300 w-0"></div>
                            </div>
                            <p id="strengthLabel" class="text-[11px] text-slate-400 mt-1"></p>
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-1.5">Yeni
                                �?ifre (Tekrar)</label>
                            <div class="relative">
                                <input id="confirmPw" type="password" class="input-field pr-10" placeholder="••••••••">
                                <button
                                    class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600"
                                    onclick="togglePw('confirmPw', this)">
                                    <i class="fas fa-eye text-sm"></i>
                                </button>
                            </div>
                        </div>
                        <div class="flex justify-end gap-3 pt-2">
                            <button class="btn-secondary" onclick="clearPwForm()">Temizle</button>
                            <button class="btn-primary" id="savePwBtn" onclick="savePassword()">
                                <i class="fas fa-lock mr-1.5"></i>�?ifreyi Değiştir
                            </button>
                        </div>
                    </div>

                    <!-- Danger zone -->
                    <div class="mt-6 bg-red-50 border border-red-100 rounded-2xl p-6">
                        <h3 class="text-sm font-bold text-red-700 mb-1 flex items-center gap-2">
                            <i class="fas fa-exclamation-triangle"></i> Tehlikeli Bölge
                        </h3>
                        <p class="text-xs text-red-600 mb-4">Bu işlemler geri alınamaz. Dikkatli kullanın.</p>                    </div>
                </div>

            </div>
        </div>
    </div>

    <script>
        const API = '/api';
        let _userData = {};

        // ── Toast ──────────────────────────────────────────────────────────────
        function showToast(msg, ok = true) {
            const t = document.getElementById('toast');
            document.getElementById('toastMsg').textContent = msg;
            document.getElementById('toastIcon').className = ok
                ? 'fas fa-check-circle text-emerald-400'
                : 'fas fa-times-circle text-red-400';
            t.style.opacity = '1';
            t.style.transform = 'translateY(0)';
            setTimeout(() => { t.style.opacity = '0'; t.style.transform = 'translateY(-8px)'; }, 3000);
        }

        // ── Sekme ─────────────────────────────────────────────────────────────
        function switchTab(tab) {
            document.getElementById('panelProfile').classList.toggle('hidden', tab !== 'profile');
            document.getElementById('panelSecurity').classList.toggle('hidden', tab !== 'security');
            document.getElementById('tabProfile').className = 'pb-3 ' + (tab === 'profile' ? 'tab-active' : 'hover:text-slate-600 transition-colors');
            document.getElementById('tabSecurity').className = 'pb-3 ' + (tab === 'security' ? 'tab-active' : 'hover:text-slate-600 transition-colors');
        }

        // ── Profili Yükle ─────────────────────────────────────────────────────
        async function loadProfile() {
            const r = await fetch(`${API}/me`);
            if (r.status === 401) { window.location.href = '/login'; return; }
            const d = await r.json();
            _userData = d;

            const initials = d.name ? d.name.split(' ').map(p => p[0]).join('').toUpperCase().slice(0, 2) : '?';
            document.getElementById('bigAvatar').textContent = initials;
            document.getElementById('avatarName').textContent = d.name || '—';
            document.getElementById('avatarEmail').textContent = d.email || '—';
            document.getElementById('avatarRole').textContent = d.role || '—';

            document.getElementById('profileName').value = d.name || '';
            document.getElementById('profileEmail').value = d.email || '';
        }

        // ── Profili Kaydet ────────────────────────────────────────────────────
        async function saveProfile() {
            const name = document.getElementById('profileName').value.trim();
            const email = document.getElementById('profileEmail').value.trim();
            if (!name || !email) { showToast('Ad ve e-posta zorunlu', false); return; }

            const btn = document.getElementById('saveProfileBtn');
            btn.disabled = true; btn.innerHTML = '<i class="fas fa-spinner fa-spin mr-1.5"></i>Kaydediliyor…';

            try {
                const r = await fetch(`${API}/account/profile`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, email })
                });
                const d = await r.json();
                if (r.ok) {
                    showToast('Profil güncellendi ✓');
                    await loadProfile();
                } else {
                    showToast(d.error || 'Hata oluştu', false);
                }
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-save mr-1.5"></i>Kaydet';
            }
        }

        // ── Password ─────────────────────────────────────────────────────────
        function togglePw(id, btn) {
            const inp = document.getElementById(id);
            const isHidden = inp.type === 'password';
            inp.type = isHidden ? 'text' : 'password';
            btn.querySelector('i').className = isHidden ? 'fas fa-eye-slash text-sm' : 'fas fa-eye text-sm';
        }

        function checkStrength() {
            const pw = document.getElementById('newPw').value;
            const bar = document.getElementById('strengthBar');
            const lbl = document.getElementById('strengthLabel');
            let score = 0;
            if (pw.length >= 8) score++;
            if (/[A-Z]/.test(pw)) score++;
            if (/[0-9]/.test(pw)) score++;
            if (/[^A-Za-z0-9]/.test(pw)) score++;
            const map = [
                { w: '0%', color: '', text: '' },
                { w: '25%', color: 'bg-red-400', text: 'Çok zayıf' },
                { w: '50%', color: 'bg-amber-400', text: 'Zayıf' },
                { w: '75%', color: 'bg-yellow-400', text: 'Orta' },
                { w: '100%', color: 'bg-emerald-500', text: 'Güçlü ✓' },
            ];
            bar.style.width = map[score].w;
            bar.className = 'h-full rounded-full transition-all duration-300 ' + map[score].color;
            lbl.textContent = map[score].text;
        }

        function clearPwForm() {
            ['currentPw', 'newPw', 'confirmPw'].forEach(id => document.getElementById(id).value = '');
            document.getElementById('strengthBar').style.width = '0';
            document.getElementById('strengthLabel').textContent = '';
        }

        async function savePassword() {
            const current = document.getElementById('currentPw').value;
            const newPw = document.getElementById('newPw').value;
            const confirm = document.getElementById('confirmPw').value;

            if (!current || !newPw || !confirm) { showToast('Tüm alanları doldurun', false); return; }
            if (newPw !== confirm) { showToast('Yeni şifreler eşleşmiyor', false); return; }
            if (newPw.length < 8) { showToast('�?ifre en az 8 karakter olmalı', false); return; }

            const btn = document.getElementById('savePwBtn');
            btn.disabled = true; btn.innerHTML = '<i class="fas fa-spinner fa-spin mr-1.5"></i>Kaydediliyor…';

            try {
                const r = await fetch(`${API}/account/password`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ current_password: current, new_password: newPw })
                });
                const d = await r.json();
                if (r.ok) {
                    showToast('�?ifre başarıyla güncellendi ✓');
                    clearPwForm();
                } else {
                    showToast(d.error || '�?ifre değiştirilemedi', false);
                }
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-lock mr-1.5"></i>�?ifreyi Değiştir';
            }
        }

        document.addEventListener('DOMContentLoaded', loadProfile);
    </script>
    <script src="/static/topbar-global.js"></script>
</body>

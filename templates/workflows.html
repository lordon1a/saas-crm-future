<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <script src="{{ url_for('static', filename='csrf-protection.js') }}"></script>
    <script src="{{ url_for('static', filename='sidebar-early-init.js') }}"></script>
    <title>WhatsApp CRM - İş Akışları</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Vite React Bundle (includes React 19, @xyflow/react 12, Tailwind 4) -->
    <link rel="stylesheet" href="{{ url_for('static', filename='react/workflow-app.css') }}">
    <style>
        html.sidebar-collapsed #mainSidebar { width: 64px !important; transition: none !important; }
        html.sidebar-collapsed #mainSidebar .sidebar-text,
        html.sidebar-collapsed #mainSidebar .nav-text { opacity: 0 !important; width: 0 !important; overflow: hidden !important; }
        html.sidebar-collapsed #mainSidebar .sidebar-toggle-icon,
        html.sidebar-collapsed #mainSidebar .sidebar-toggle i { transform: rotate(180deg) !important; }
        body { margin: 0; padding: 0; overflow: hidden; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 text-[13px] h-screen overflow-hidden flex font-sans antialiased" style="font-family: 'Inter', sans-serif;">
    <!-- Sidebar -->
    <aside id="mainSidebar" data-collapsed="false" class="h-screen bg-white border-r border-slate-200 flex flex-col pt-5 z-30 relative shadow-sm flex-shrink-0 w-56 xl:w-60 transition-[width] duration-200 ease-linear">
        <div class="flex items-center px-3 mb-6">
            <a href="/" class="w-10 h-10 bg-violet-600 rounded-xl flex items-center justify-center text-white text-xl shadow-lg hover:scale-105 transition-transform flex-shrink-0" title="Ana Sayfa">
                <span class="text-2xl">S</span>
            </a>
            <span class="sidebar-text text-base font-bold text-slate-800 pl-3 whitespace-nowrap overflow-hidden">Sleek CRM</span>
        </div>

        <nav class="flex-1 flex flex-col gap-1 w-full px-3 sidebar-scroll overflow-y-auto">
            <a href="/" class="sidebar-nav-item h-9 flex items-center text-slate-600 hover:text-violet-600 hover:bg-violet-50 rounded-xl transition-all" title="Gelen Kutusu">
                <i class="fas fa-inbox text-lg w-10 text-center flex-shrink-0"></i>
                <span class="sidebar-text text-sm font-medium whitespace-nowrap overflow-hidden">Gelen Kutusu</span>
            </a>
            <a href="/analytics" class="sidebar-nav-item h-9 flex items-center text-slate-600 hover:text-violet-600 hover:bg-violet-50 rounded-xl transition-all" title="Raporlar">
                <i class="fas fa-chart-line text-lg w-10 text-center flex-shrink-0"></i>
                <span class="sidebar-text text-sm font-medium whitespace-nowrap overflow-hidden">Raporlar</span>
            </a>
            <a href="/contacts" class="sidebar-nav-item h-9 flex items-center text-slate-600 hover:text-violet-600 hover:bg-violet-50 rounded-xl transition-all" title="Kişiler">
                <i class="fas fa-address-book text-lg w-10 text-center flex-shrink-0"></i>
                <span class="sidebar-text text-sm font-medium whitespace-nowrap overflow-hidden">Kişiler</span>
            </a>
            <a href="/companies" class="sidebar-nav-item h-9 flex items-center text-slate-600 hover:text-violet-600 hover:bg-violet-50 rounded-xl transition-all" title="Şirketler">
                <i class="fas fa-building text-lg w-10 text-center flex-shrink-0"></i>
                <span class="sidebar-text text-sm font-medium whitespace-nowrap overflow-hidden">Şirketler</span>
            </a>
            <a href="/broadcast" class="sidebar-nav-item h-9 flex items-center text-slate-600 hover:text-violet-600 hover:bg-violet-50 rounded-xl transition-all" title="Broadcast">
                <i class="fas fa-bullhorn text-lg w-10 text-center flex-shrink-0"></i>
                <span class="sidebar-text text-sm font-medium whitespace-nowrap overflow-hidden">Broadcast</span>
            </a>

            <div class="w-full h-px bg-slate-200 my-2"></div>

            <a href="/automation" class="sidebar-nav-item h-9 flex items-center text-slate-600 hover:text-violet-600 hover:bg-violet-50 rounded-xl transition-all" title="Otomasyon">
                <i class="fas fa-robot text-lg w-10 text-center flex-shrink-0"></i>
                <span class="sidebar-text text-sm font-medium whitespace-nowrap overflow-hidden">Otomasyon</span>
            </a>
            <a href="/workflows" class="sidebar-nav-item h-9 flex items-center text-violet-600 bg-violet-50 rounded-xl transition-all" title="Workflows">
                <i class="fas fa-project-diagram text-lg w-10 text-center flex-shrink-0"></i>
                <span class="sidebar-text text-sm font-medium whitespace-nowrap overflow-hidden">Workflows</span>
            </a>
            <a href="/pipeline" class="sidebar-nav-item h-9 flex items-center text-slate-600 hover:text-violet-600 hover:bg-violet-50 rounded-xl transition-all" title="Pipeline">
                <i class="fas fa-filter text-lg w-10 text-center flex-shrink-0"></i>
                <span class="sidebar-text text-sm font-medium whitespace-nowrap overflow-hidden">Pipeline</span>
            </a>
            <a href="/tasks" class="sidebar-nav-item h-9 flex items-center text-slate-600 hover:text-violet-600 hover:bg-violet-50 rounded-xl transition-all" title="Görevler">
                <i class="fas fa-list-check text-lg w-10 text-center flex-shrink-0"></i>
                <span class="sidebar-text text-sm font-medium whitespace-nowrap overflow-hidden">Görevler</span>
            </a>
            <a href="/documents" class="sidebar-nav-item h-9 flex items-center text-slate-600 hover:text-violet-600 hover:bg-violet-50 rounded-xl transition-all" title="Dokümanlar">
                <i class="fas fa-file-alt text-lg w-10 text-center flex-shrink-0"></i>
                <span class="sidebar-text text-sm font-medium whitespace-nowrap overflow-hidden">Dokümanlar</span>
            </a>
            <a href="/channels" class="sidebar-nav-item h-9 flex items-center text-slate-600 hover:text-violet-600 hover:bg-violet-50 rounded-xl transition-all" title="Kanallar">
                <i class="fas fa-satellite-dish text-lg w-10 text-center flex-shrink-0"></i>
                <span class="sidebar-text text-sm font-medium whitespace-nowrap overflow-hidden">Kanallar</span>
            </a>

            <div class="w-full h-px bg-slate-200 my-2"></div>

            <a href="/settings" class="sidebar-nav-item h-9 flex items-center text-slate-600 hover:text-violet-600 hover:bg-violet-50 rounded-xl transition-all" title="Ayarlar">
                <i class="fas fa-cog text-lg w-10 text-center flex-shrink-0"></i>
                <span class="sidebar-text text-sm font-medium whitespace-nowrap overflow-hidden">Ayarlar</span>
            </a>
        </nav>
    </aside>

    <!-- React App Mount Point -->
    <main class="flex-1 h-screen overflow-hidden">
        <div id="workflow-react-root" style="width: 100%; height: 100%;"></div>
    </main>

    <!-- Vite React Bundle -->
    <script src="{{ url_for('static', filename='react/workflow-app.js') }}"></script>
</body>
</html>

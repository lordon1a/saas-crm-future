{% if 'ai_assistant' in installed_apps %}
<div id="ai-sidebar" style="

    display: flex; flex-direction: column;
    transition: right 0.3s cubic-bezier(0.4, 0, 0.2, 1); box-shadow: -8px 0 32px rgba(0,0,0,0.08);
">
    <!-- Header -->
    <div style="padding: 0; flex-shrink: 0; position: relative; overflow: hidden;">
        <!-- Gradient background -->
        <div style="position: absolute; inset: 0; background: linear-gradient(135deg, #1e1b4b 0%, #312e81 40%, #4c1d95 100%);"></div>

        <div style="position: relative; padding: 16px 20px; display: flex; align-items: center; justify-content: space-between;">
            <div style="display: flex; align-items: center; gap: 12px;">
                <div style="width: 38px; height: 38px; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.15); backdrop-filter: blur(12px); border-radius: 12px; display: flex; align-items: center; justify-content: center;">
                    <span style="font-size: 18px; line-height: 1;">🐧</span>
                </div>
                <div>
                    <div style="font-size: 15px; font-weight: 800; color: #fff; letter-spacing: -0.02em;">CRM Asistan</div>
                    <div style="display: flex; align-items: center; gap: 5px; margin-top: 1px;">
                        <span style="width: 6px; height: 6px; background: #34d399; border-radius: 50%; box-shadow: 0 0 6px rgba(52,211,153,0.6);"></span>
                        <span style="font-size: 10px; color: rgba(255,255,255,0.6); font-weight: 500; letter-spacing: 0.02em;">Aktif</span>
                    </div>
                </div>
            </div>
            <div style="display: flex; gap: 3px; background: rgba(0,0,0,0.15); border-radius: 10px; padding: 3px;">
                <button onclick="startNewChat()" title="Yeni sohbet" style="width: 30px; height: 30px; border: none; background: transparent; border-radius: 8px; cursor: pointer; color: rgba(255,255,255,0.7); font-size: 12px; display: flex; align-items: center; justify-content: center; transition: all 0.15s;" onmouseover="this.style.background='rgba(255,255,255,0.12)';this.style.color='#fff'" onmouseout="this.style.background='transparent';this.style.color='rgba(255,255,255,0.7)'">
                    <i class="fas fa-plus"></i>
                </button>
                <button onclick="toggleHistoryPanel()" id="ai-history-btn" title="Sohbet gecmisi" style="width: 30px; height: 30px; border: none; background: transparent; border-radius: 8px; cursor: pointer; color: rgba(255,255,255,0.7); font-size: 12px; display: flex; align-items: center; justify-content: center; transition: all 0.15s;" onmouseover="this.style.background='rgba(255,255,255,0.12)';this.style.color='#fff'" onmouseout="this.style.background='transparent';this.style.color='rgba(255,255,255,0.7)'">
                    <i class="fas fa-clock-rotate-left"></i>
                </button>
                <div style="width: 1px; background: rgba(255,255,255,0.1); margin: 4px 1px;"></div>
                <button onclick="closeAISidebar()" title="Kapat" style="width: 30px; height: 30px; border: none; background: transparent; border-radius: 8px; cursor: pointer; color: rgba(255,255,255,0.7); font-size: 13px; display: flex; align-items: center; justify-content: center; transition: all 0.15s;" onmouseover="this.style.background='rgba(239,68,68,0.2)';this.style.color='#fca5a5'" onmouseout="this.style.background='transparent';this.style.color='rgba(255,255,255,0.7)'">

                </button>
            </div>
        </div>
        <!-- Bottom glow line -->
        <div style="height: 1px; background: linear-gradient(90deg, transparent 0%, rgba(167,139,250,0.5) 30%, rgba(139,92,246,0.6) 50%, rgba(167,139,250,0.5) 70%, transparent 100%);"></div>
    </div>

    <!-- History Panel (hidden by default) -->

        <div style="padding:14px 20px; border-bottom:1px solid #f1f5f9; display:flex; align-items:center; justify-content:space-between;">
            <span style="font-size:13px; font-weight:700; color:#1e293b;"><i class="fas fa-clock-rotate-left" style="margin-right:8px; color:#7c3aed;"></i>Sohbet Gecmisi</span>

            <!-- Welcome Quick Actions Grid -->
            <div id="ai-welcome-actions" style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 20px; text-align: left;">
                <button onclick="quickAction('pipeline_ozet')" class="ai-welcome-btn" style="padding: 12px; background: #fff; border: 1px solid #e2e8f0; border-radius: 12px; cursor: pointer; transition: all 0.15s; text-align: left;" onmouseover="this.style.borderColor='#c4b5fd';this.style.background='#faf5ff'" onmouseout="this.style.borderColor='#e2e8f0';this.style.background='#fff'">
                    <div style="width: 28px; height: 28px; background: #ede9fe; border-radius: 8px; display: flex; align-items: center; justify-content: center; margin-bottom: 8px;"><i class="fas fa-chart-pie" style="font-size: 11px; color: #7c3aed;"></i></div>

                <button onclick="quickAction('deal_analiz')" class="ai-welcome-btn" style="padding: 12px; background: #fff; border: 1px solid #e2e8f0; border-radius: 12px; cursor: pointer; transition: all 0.15s; text-align: left;" onmouseover="this.style.borderColor='#c4b5fd';this.style.background='#faf5ff'" onmouseout="this.style.borderColor='#e2e8f0';this.style.background='#fff'">

                <button onclick="quickAction('yeni_kayit')" class="ai-welcome-btn" style="padding: 12px; background: #fff; border: 1px solid #e2e8f0; border-radius: 12px; cursor: pointer; transition: all 0.15s; text-align: left;" onmouseover="this.style.borderColor='#c4b5fd';this.style.background='#faf5ff'" onmouseout="this.style.borderColor='#e2e8f0';this.style.background='#fff'">
                    <div style="width: 28px; height: 28px; background: #dcfce7; border-radius: 8px; display: flex; align-items: center; justify-content: center; margin-bottom: 8px;"><i class="fas fa-plus" style="font-size: 11px; color: #16a34a;"></i></div>

                <button onclick="quickAction('email_taslak')" class="ai-welcome-btn" style="padding: 12px; background: #fff; border: 1px solid #e2e8f0; border-radius: 12px; cursor: pointer; transition: all 0.15s; text-align: left;" onmouseover="this.style.borderColor='#c4b5fd';this.style.background='#faf5ff'" onmouseout="this.style.borderColor='#e2e8f0';this.style.background='#fff'">
                    <div style="width: 28px; height: 28px; background: #fef3c7; border-radius: 8px; display: flex; align-items: center; justify-content: center; margin-bottom: 8px;"><i class="fas fa-envelope" style="font-size: 11px; color: #d97706;"></i></div>
                    <div style="font-size: 12px; font-weight: 600; color: #1e293b;">E-posta Taslagi</div>

            <i class="fas fa-user-check" style="font-size: 10px;"></i> Musteri Analizi

        <button onclick="quickAction('takip_onerisi')" class="ai-chip-btn" style="padding: 6px 12px; background: #f1f5f9; color: #475569; border: 1px solid transparent; border-radius: 8px; font-size: 11px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 5px; transition: all 0.15s;" onmouseover="this.style.background='#ede9fe';this.style.color='#6d28d9';this.style.borderColor='#c4b5fd'" onmouseout="this.style.background='#f1f5f9';this.style.color='#475569';this.style.borderColor='transparent'">

    <!-- Input Alani -->
    <div id="ai-input-area" style="padding: 10px 16px 14px; background: #fff; position: relative;">
        <!-- @ mention dropdown -->
        <div id="mention-dropdown" style="display: none; position: absolute; bottom: 100%; left: 16px; right: 16px; background: white; border: 1px solid #e2e8f0; border-radius: 12px; box-shadow: 0 -4px 20px rgba(0,0,0,0.1); max-height: 200px; overflow-y: auto; z-index: 200;">
            <div style="padding: 10px 14px; font-size: 10px; font-weight: 700; color: #94a3b8; border-bottom: 1px solid #f1f5f9; text-transform: uppercase; letter-spacing: 0.05em;">Kayitlar</div>

        <div style="border: 1.5px solid #e2e8f0; border-radius: 14px; overflow: hidden; background: #f8fafc; transition: border-color 0.2s;" onfocusin="this.style.borderColor='#a78bfa'" onfocusout="this.style.borderColor='#e2e8f0'">
            <div id="ai-input-display" contenteditable="true"
                style="min-height: 44px; max-height: 120px; overflow-y: auto; padding: 12px 14px; font-size: 13px; color: #1e293b; outline: none; line-height: 1.6; background: transparent;"

            <!-- Alt toolbar -->

                    <button onclick="triggerMention()" title="Kayit sec (@)" style="width: 28px; height: 28px; border: none; background: none; cursor: pointer; color: #94a3b8; font-size: 13px; border-radius: 6px; display: flex; align-items: center; justify-content: center; transition: all 0.15s;" onmouseover="this.style.background='#ede9fe';this.style.color='#7c3aed'" onmouseout="this.style.background='none';this.style.color='#94a3b8'">

<style>
@keyframes aiBounce {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-4px); }
}
@keyframes aiFadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
}
#ai-input-display:empty:before {
    content: attr(data-placeholder);
    color: #94a3b8;
    pointer-events: none;
}
#ai-messages::-webkit-scrollbar { width: 4px; }
#ai-messages::-webkit-scrollbar-track { background: transparent; }
#ai-messages::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
#ai-messages::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
#mention-dropdown::-webkit-scrollbar { width: 4px; }
#mention-dropdown::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
#ai-history-list::-webkit-scrollbar { width: 4px; }
#ai-history-list::-webkit-scrollbar-track { background: transparent; }
#ai-history-list::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
#ai-messages > div { animation: aiFadeIn 0.25s ease-out; }
</style>

<script>
// Get workspace_id from session for localStorage isolation
var WORKSPACE_ID = '{{ session.get("workspace_id", "default") }}';
var AI_CONVERSATIONS_KEY = 'ai_conversations_' + WORKSPACE_ID;
var AI_ACTIVE_KEY = 'ai_active_conversation_' + WORKSPACE_ID;
var aiMessages = [];
var aiOpen = false;
var aiHistoryOpen = false;
var activeConversationId = null;
var pageContext = {};
var mentionQuery = '';
var mentionActive = false;
var mentionedRecords = [];

function generateConvId() {
    return 'conv_' + Date.now() + '_' + Math.random().toString(36).substr(2, 6);
}

function getAllConversations() {
    try {
        var raw = localStorage.getItem(AI_CONVERSATIONS_KEY);
        return raw ? JSON.parse(raw) : [];
    } catch(e) { return []; }
}

function saveAllConversations(convs) {
    try {
        localStorage.setItem(AI_CONVERSATIONS_KEY, JSON.stringify(convs));
    } catch(e) {}
}

function saveAIHistory() {
    if (!activeConversationId) return;
    var convs = getAllConversations();
    var found = false;
    var title = '';
    if (aiMessages.length > 0) {
        var firstUser = aiMessages.find(function(m) { return m.role === 'user'; });
        title = firstUser ? firstUser.content.substring(0, 60) : 'Yeni Sohbet';
    }
    for (var i = 0; i < convs.length; i++) {
        if (convs[i].id === activeConversationId) {
            convs[i].messages = aiMessages.slice(-50);
            convs[i].updated_at = Date.now();
            if (title) convs[i].title = title;
            found = true;
            break;
        }
    }
    if (!found && aiMessages.length > 0) {
        convs.unshift({
            id: activeConversationId,
            title: title || 'Yeni Sohbet',
            messages: aiMessages.slice(-50),
            created_at: Date.now(),
            updated_at: Date.now()
        });
    }
    if (convs.length > 30) convs = convs.slice(0, 30);
    saveAllConversations(convs);
    try { localStorage.setItem(AI_ACTIVE_KEY, activeConversationId); } catch(e) {}
}

function loadConversation(convId) {
    hideHistoryPanel();
    var convs = getAllConversations();
    var conv = convs.find(function(c) { return c.id === convId; });
    activeConversationId = convId;
    aiMessages = conv ? (conv.messages || []) : [];
    try { localStorage.setItem(AI_ACTIVE_KEY, convId); } catch(e) {}
    renderCurrentMessages();
}

function renderCurrentMessages() {
    var container = document.getElementById('ai-messages');
    container.innerHTML = '';
    if (aiMessages.length === 0) {
        container.innerHTML = '<div id="ai-welcome" style="text-align:center;padding:32px 20px;">'
            + '<div style="width:56px;height:56px;background:linear-gradient(135deg,#ede9fe,#ddd6fe);border-radius:16px;display:flex;align-items:center;justify-content:center;margin:0 auto 16px;">'
            + '<span style="font-size:28px;line-height:1;">\ud83d\udc27</span></div>'
            + '<div style="font-size:16px;font-weight:700;color:#1e293b;margin-bottom:6px;">Merhaba!</div>'
            + '<div style="font-size:12px;color:#94a3b8;line-height:1.6;max-width:280px;margin:0 auto;">CRM verilerinizi analiz edebilir, rapor olusturabilir ve aksiyonlar alabilirim.</div>'
            + '<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:20px;text-align:left;">'
            + _welcomeActionBtn('pipeline_ozet', 'fa-chart-pie', '#ede9fe', '#7c3aed', 'Pipeline Ozeti', 'Satis durumu ve gelir')
            + _welcomeActionBtn('deal_analiz', 'fa-handshake', '#dbeafe', '#3b82f6', 'Deal Analizi', 'Acik deal\'lari incele')
            + _welcomeActionBtn('yeni_kayit', 'fa-plus', '#dcfce7', '#16a34a', 'Kayit Olustur', 'Contact veya deal ekle')
            + _welcomeActionBtn('email_taslak', 'fa-envelope', '#fef3c7', '#d97706', 'E-posta Taslagi', 'Takip veya teklif yaz')
            + '</div></div>';
    } else {
        aiMessages.forEach(function(msg) {
            appendMessage(msg.role, msg.content, false, true);
        });
    }
}

function _welcomeActionBtn(action, icon, bg, color, title, desc) {
    return '<button onclick="quickAction(\'' + action + '\')" style="padding:12px;background:#fff;border:1px solid #e2e8f0;border-radius:12px;cursor:pointer;transition:all 0.15s;text-align:left;" onmouseover="this.style.borderColor=\'#c4b5fd\';this.style.background=\'#faf5ff\'" onmouseout="this.style.borderColor=\'#e2e8f0\';this.style.background=\'#fff\'">'
        + '<div style="width:28px;height:28px;background:' + bg + ';border-radius:8px;display:flex;align-items:center;justify-content:center;margin-bottom:8px;"><i class="fas ' + icon + '" style="font-size:11px;color:' + color + ';"></i></div>'
        + '<div style="font-size:12px;font-weight:600;color:#1e293b;">' + title + '</div>'
        + '<div style="font-size:11px;color:#94a3b8;margin-top:2px;">' + desc + '</div></button>';
}

function startNewChat() {
    if (aiMessages.length > 0) saveAIHistory();
    hideHistoryPanel();
    activeConversationId = generateConvId();
    aiMessages = [];
    mentionedRecords = [];
    try { localStorage.setItem(AI_ACTIVE_KEY, activeConversationId); } catch(e) {}
    renderCurrentMessages();
    document.getElementById('ai-input-display').focus();
}

function deleteConversation(convId, evt) {
    if (evt) { evt.stopPropagation(); evt.preventDefault(); }
    var convs = getAllConversations().filter(function(c) { return c.id !== convId; });
    saveAllConversations(convs);
    if (convId === activeConversationId) {
        startNewChat();
    }
    renderHistoryList();
}

function clearAllConversations() {
    saveAllConversations([]);
    startNewChat();
    renderHistoryList();
}

function toggleHistoryPanel() {
    if (aiHistoryOpen) {
        hideHistoryPanel();
    } else {
        showHistoryPanel();
    }
}

function showHistoryPanel() {
    aiHistoryOpen = true;
    renderHistoryList();
    document.getElementById('ai-history-panel').style.display = 'flex';
    document.getElementById('ai-messages').style.display = 'none';
    document.getElementById('ai-quick-actions').style.display = 'none';
    document.getElementById('ai-input-area').style.display = 'none';
    var histBtn = document.getElementById('ai-history-btn');

document.addEventListener('DOMContentLoaded', function() {
    try {
        // Migrate old single-conversation format
        var oldData = localStorage.getItem('ai_chat_history');
        if (oldData) {
            var oldMessages = JSON.parse(oldData);
            if (oldMessages && oldMessages.length > 0) {
                var migrated = getAllConversations();
                var firstUser = oldMessages.find(function(m) { return m.role === 'user'; });
                migrated.unshift({
                    id: generateConvId(),
                    title: firstUser ? firstUser.content.substring(0, 60) : 'Eski Sohbet',
                    messages: oldMessages,
                    created_at: Date.now(),
                    updated_at: Date.now()
                });
                saveAllConversations(migrated);
            }
            localStorage.removeItem('ai_chat_history');
        }

        var savedId = localStorage.getItem(AI_ACTIVE_KEY);
        var convs = getAllConversations();
        if (savedId && convs.find(function(c) { return c.id === savedId; })) {
            activeConversationId = savedId;
        } else if (convs.length > 0) {
            activeConversationId = convs[0].id;
        } else {
            activeConversationId = generateConvId();
        }
        var conv = convs.find(function(c) { return c.id === activeConversationId; });
        aiMessages = conv ? (conv.messages || []) : [];
        if (aiMessages.length > 0) {
            var welcome = document.getElementById('ai-welcome');
            if (welcome) welcome.remove();
            aiMessages.forEach(function(msg) {
                appendMessage(msg.role, msg.content, false, true);
            });
        }
    } catch(e) {
        activeConversationId = generateConvId();
        aiMessages = [];
    }
});

    input.appendChild(chip);

function getInputText() {
    var input = document.getElementById('ai-input-display');
    var text = '';
    input.childNodes.forEach(function(node) {
        if (node.nodeType === Node.TEXT_NODE) {
            text += node.textContent;
        } else if (node.dataset && node.dataset.record) {
            var r = JSON.parse(node.dataset.record);
            text += '@' + r.name;
        }
    });
    return text.trim();
}

async function executeAction(action, params, cardId) {
    var card = document.getElementById(cardId);
    if (card) card.closest('div').remove();
    appendTypingIndicator();
    try {
        var res = await fetch('/api/ai/execute-action', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-CSRFToken': (document.querySelector('meta[name="csrf-token"]') || {}).content || ''
            },
            body: JSON.stringify({ action: action, params: params })
        });
        var data = await res.json();
        var ti = document.getElementById('typing-indicator');
        if (ti) ti.remove();
        if (res.ok) {
            appendMessage('assistant', '\u2705 ' + data.message, true);
        } else {
            appendMessage('assistant', '\u274c Hata: ' + data.error);
        }
    } catch (err) {
        var ti2 = document.getElementById('typing-indicator');
        if (ti2) ti2.remove();
        appendMessage('assistant', 'Baglanti hatasi.');
    }
}

async function sendAIMessage() {
    var text = getInputText();
    if (!text) return;

    clearInput();
    if (!aiOpen) toggleAISidebar();
    appendMessage('user', text);
    aiMessages.push({ role: 'user', content: text });
    saveAIHistory();

    var btn = document.getElementById('ai-send-btn');
    btn.disabled = true;
    btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';
    appendTypingIndicator();

    var richContext = Object.assign({}, pageContext);
    for (var i = 0; i < mentionedRecords.length; i++) {
        var rec = mentionedRecords[i];
        try {
            var ctx = await fetch('/api/ai/context/' + rec.type + '/' + rec.id);
            if (ctx.ok) {
                var ctxData = await ctx.json();
                Object.assign(richContext, ctxData.context);
            }
        } catch (e) {}
    }
    if (!mentionedRecords.length) {
        try {
            if (pageContext.deal_id) {
                var r1 = await fetch('/api/ai/context/deal/' + pageContext.deal_id);
                if (r1.ok) { var d1 = await r1.json(); Object.assign(richContext, d1.context); }
            } else if (pageContext.contact_id) {
                var r2 = await fetch('/api/ai/context/contact/' + pageContext.contact_id);
                if (r2.ok) { var d2 = await r2.json(); Object.assign(richContext, d2.context); }
            } else if (pageContext.company_id) {
                var r3 = await fetch('/api/ai/context/company/' + pageContext.company_id);
                if (r3.ok) { var d3 = await r3.json(); Object.assign(richContext, d3.context); }
            }
        } catch (e) { console.warn('Context fetch error:', e); }
    }

    try {
        var res = await fetch('/api/ai/chat', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-CSRFToken': (document.querySelector('meta[name="csrf-token"]') || {}).content || ''
            },
            body: JSON.stringify({
                messages: aiMessages,
                context: richContext,
                mentioned_records: mentionedRecords
            })
        });
        var data = await res.json();
        var ti = document.getElementById('typing-indicator');
        if (ti) ti.remove();
        if (res.ok) {
            if (data.requires_confirmation) {
                appendConfirmCard(data.action, data.params);
            } else {
                appendMessage('assistant', data.response);
                aiMessages.push({ role: 'assistant', content: data.response });
                saveAIHistory();
            }
        } else {
            appendMessage('assistant', 'Hata: ' + (data.error || 'Bilinmeyen hata'));
        }
    } catch (err) {
        var ti3 = document.getElementById('typing-indicator');
        if (ti3) ti3.remove();
        appendMessage('assistant', 'Baglanti hatasi. Lutfen tekrar deneyin.');
    } finally {
        btn.disabled = false;
        btn.innerHTML = '<i class="fas fa-paper-plane"></i>';
        mentionedRecords = [];
    }
}

async function summarizeConversation() {
    if (!aiOpen) toggleAISidebar();
    var msgElements = document.querySelectorAll('.message-content, .conversation-message');
    var messagesText = '';
    var richContext = Object.assign({}, pageContext);
    if (msgElements.length > 0) {
        messagesText = Array.from(msgElements).map(function(el) { return el.innerText; }).join('\n');
    } else if (Object.keys(richContext).length > 0) {
        messagesText = Object.entries(richContext).map(function(kv) { return kv[0] + ': ' + kv[1]; }).join('\n');
    } else {
        appendMessage('assistant', 'Ozetlenecek konusma bulunamadi.');
        return;
    }
    appendMessage('user', 'Bu sayfayi ozetle');
    appendTypingIndicator();
    try {
        var res = await fetch('/api/ai/summarize', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'X-CSRFToken': (document.querySelector('meta[name="csrf-token"]') || {}).content || '' },
            body: JSON.stringify({ messages_text: messagesText })
        });
        var data = await res.json();
        var ti = document.getElementById('typing-indicator'); if (ti) ti.remove();
        if (res.ok) { appendMessage('assistant', data.response); aiMessages.push({ role: 'assistant', content: data.response }); saveAIHistory(); }
        else { appendMessage('assistant', 'Hata: ' + data.error); }
    } catch (err) { var ti2 = document.getElementById('typing-indicator'); if (ti2) ti2.remove(); appendMessage('assistant', 'Baglanti hatasi.'); }
}

    <script>
        document.querySelectorAll('input[name="target"]').forEach(radio => {
            radio.addEventListener('change', (e) => {
                const tagSelector = document.getElementById('tagSelector');
                tagSelector.classList.toggle('hidden', e.target.value !== 'tags');
            });
        });

        document.getElementById('broadcastContent').addEventListener('input', (e) => {
            document.getElementById('previewText').textContent = e.target.value || 'Mesaj önizlemesi burada görünecek...';
        });

        async function sendBroadcast() {
            const content = document.getElementById('broadcastContent').value.trim();
            if (!content) return alert('Lütfen mesaj içeriği girin.');
            if (!confirm('Kampanyayı başlatmak istediğinize emin misiniz?')) return;

            const btn = document.getElementById('sendBtn');
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-circle-notch fa-spin mr-2"></i>Gönderiliyor...';

            try {
                const res = await fetch('/api/broadcast/send', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        target: document.querySelector('input[name="target"]:checked').value,
                        tag: document.getElementById('broadcastTags').value,
                        content: content
                    })
                });

                if (res.ok) {
                    const data = await res.json();
                    let msg = data.count + ' mesaj gönderildi.';
                    if (data.failed > 0) msg += ' ' + data.failed + ' adet başarısız.';
                    alert(msg);
                    window.location.reload();
                } else {
                    const err = await res.json();
                    alert('Hata: ' + (err.error || err.message || 'Bilinmeyen hata'));
                }
            } catch (e) { alert('Bağlantı hatası.'); }
            finally { btn.disabled = false; btn.innerHTML = '<i class="fas fa-paper-plane"></i> Gönderimi Başlat'; }
        }
    </script>

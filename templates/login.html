<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhatsApp CRM - Giriş Yap</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Inter"', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            50: '#f5f3ff',
                            100: '#ede9fe',
                            500: '#8b5cf6',
                            600: '#7c3aed',
                            900: '#4c1d95',
                        }
                    }
                }
            }
        }
    </script>
</head>

<body class="bg-slate-50 min-h-screen flex items-center justify-center p-6 font-sans antialiased text-slate-800">
    <div class="w-full max-w-md">
        <div class="text-center mb-8">
            <div class="w-16 h-16 bg-brand-600 rounded-2xl flex items-center justify-center text-white text-3xl shadow-lg mx-auto mb-6">
                <i class="fab fa-whatsapp"></i>
            </div>
            <h1 class="text-2xl font-bold text-slate-800">Tekrar Hoş Geldiniz</h1>
            <p class="text-slate-500 text-sm mt-2">WhatsApp CRM ile iletişiminizi yönetin.</p>
        </div>

        <div class="bg-white p-8 rounded-3xl border border-slate-200 shadow-xl">
            <div id="errorMsg" class="hidden bg-red-50 border border-red-100 text-red-600 text-xs font-bold px-4 py-3 rounded-xl mb-6 text-center"></div>

            <form id="loginForm" class="space-y-5">
                <div>
                    <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-2 ml-1">E-posta Adresi</label>
                    <input type="email" id="email" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-sm outline-none focus:bg-white focus:border-brand-500 transition-all" placeholder="admin@example.com" required>
                </div>
                <div>
                    <div class="flex items-center justify-between mb-2 ml-1">
                        <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-wider">Şifre</label>
                        <a href="#" class="text-[10px] font-bold text-brand-600 hover:text-brand-700 uppercase tracking-wider">Unuttum?</a>
                    </div>
                    <input type="password" id="password" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-sm outline-none focus:bg-white focus:border-brand-500 transition-all" placeholder="••••••••" required>
                </div>
                <button type="submit" id="loginBtn" class="w-full py-3.5 bg-brand-600 text-white rounded-xl text-sm font-bold hover:bg-brand-700 transition-all shadow-lg shadow-brand-600/10">Giriş Yap</button>
            </form>

            <div class="mt-8 pt-6 border-t border-slate-100">
                <div class="bg-slate-50 rounded-xl p-4 border border-slate-100">
                    <p class="text-[9px] font-bold text-slate-400 uppercase tracking-widest text-center mb-2">Demo Hesaplar</p>
                    <div class="text-[10px] font-semibold text-slate-600 text-center space-y-1">
                        <p>admin@ayse.com / admin123</p>
                        <p>admin@example.com / admin123</p>
                    </div>
                </div>
            </div>
        </div>

        <p class="text-center mt-8 text-sm font-medium text-slate-500">
            Hesabınız yok mu? <a href="/register" class="text-brand-600 font-bold hover:text-brand-700">Ücretsiz Kayıt Olun</a>
        </p>
    </div>

    <script>
        const form = document.getElementById('loginForm');
        const errorMsg = document.getElementById('errorMsg');
        const loginBtn = document.getElementById('loginBtn');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            loginBtn.disabled = true;
            loginBtn.innerHTML = '<i class="fas fa-circle-notch fa-spin mr-2"></i>Giriş yapılıyor...';
            errorMsg.classList.add('hidden');

            try {
                const res = await fetch('/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                if (res.ok) {
                    loginBtn.innerHTML = '<i class="fas fa-check mr-2"></i>Yönlendiriliyor...';
                    window.location.href = '/';
                } else {
                    const data = await res.json();
                    errorMsg.textContent = data.error || 'Giriş başarısız';
                    errorMsg.classList.remove('hidden');
                    loginBtn.disabled = false;
                    loginBtn.textContent = 'Giriş Yap';
                }
            } catch (err) {
                errorMsg.textContent = 'Sunucuya bağlanılamadı';
                errorMsg.classList.remove('hidden');
                loginBtn.disabled = false;
                loginBtn.textContent = 'Giriş Yap';
            }
        });
    </script>
</body>

</html>

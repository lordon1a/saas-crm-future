<!DOCTYPE html>
<html lang="tr">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>WhatsApp CRM - Şablon Yönetimi</title>
	<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
	<script src="https://cdn.tailwindcss.com"></script>
	<script>
		tailwind.config = {
			theme: {
				extend: {
					fontFamily: { sans: ['"Inter"', 'sans-serif'] },
					colors: {
						brand: { 50: '#f5f3ff', 100: '#ede9fe', 500: '#8b5cf6', 600: '#7c3aed', 900: '#4c1d95' }
					}
				}
			}
		}
	</script>
</head>
<body class="bg-slate-50 text-slate-800 h-screen overflow-hidden flex font-sans antialiased">

	<!-- Sidebar -->
	{% include '_sidebar_light.html' %}

	<main class="flex-1 flex flex-col overflow-hidden">
		<!-- Topbar -->
		<header class="bg-white border-b border-gray-200 px-4 md:px-8 py-3 flex-shrink-0">
			<div class="grid grid-cols-1 lg:grid-cols-[220px_minmax(420px,1fr)_360px] items-center gap-3 md:gap-4">
				<div class="hidden lg:block"></div>
				<div class="relative w-full max-w-3xl justify-self-center">
					<i class="fas fa-search absolute left-3.5 top-1/2 -translate-y-1/2 text-gray-400 text-sm"></i>
					<input type="text" data-topbar-search placeholder="Pipedrive'da ara" class="w-full pl-10 pr-4 py-2.5 bg-white border border-gray-300 rounded-full text-sm focus:outline-none focus:ring-2 focus:ring-brand-500/20 focus:border-brand-500 transition-all">
				</div>
				<div class="flex items-center gap-1.5 md:gap-2 justify-self-end">
					<button class="hidden md:flex w-9 h-9 rounded-full text-gray-500 hover:bg-gray-100 transition-all items-center justify-center" title="Hediye">
						<i class="fas fa-gift text-sm"></i>
					</button>
					<button class="hidden md:flex w-9 h-9 rounded-full text-gray-500 hover:bg-gray-100 transition-all items-center justify-center" title="Yardim">
						<i class="fas fa-circle-question text-sm"></i>
					</button>
					<button class="hidden md:flex w-9 h-9 rounded-full text-gray-500 hover:bg-gray-100 transition-all items-center justify-center" title="Ipuclari">
						<i class="fas fa-lightbulb text-sm"></i>
					</button>
					<div class="relative">
						<button data-topbar-menu-button class="h-10 pl-2.5 pr-2 rounded-full border border-gray-300 bg-white hover:bg-gray-50 transition-all flex items-center gap-2">
							<div data-topbar-avatar class="w-7 h-7 rounded-full bg-slate-200 text-slate-700 text-xs font-bold flex items-center justify-center">YG</div>
							<span data-topbar-name class="hidden md:block text-xs font-semibold text-gray-700 max-w-[80px] truncate">Yigit</span>
							<i class="fas fa-chevron-down text-[10px] text-gray-500"></i>
						</button>
						<div data-topbar-menu class="hidden absolute right-0 top-12 w-72 bg-white border border-gray-200 rounded-xl shadow-xl py-2 z-50">
							<div data-topbar-menu-content></div>
						</div>
					</div>
				</div>
			</div>
		</header>

		<!-- Page Header -->
		<header class="h-16 bg-white border-b border-slate-200 px-8 flex items-center justify-between">
			<div class="flex items-center gap-4">
				<i class="fas fa-file-contract text-2xl text-brand-600"></i>
				<h1 class="text-xl font-bold text-slate-800">Şablon Yönetimi</h1>
			</div>
			<div class="flex items-center gap-2">
				<span class="text-sm text-slate-500"><span id="templateCount">0</span> şablon</span>
				<button id="refreshBtn" class="px-4 py-2 bg-white border border-slate-200 rounded-xl text-sm font-semibold text-slate-600 hover:bg-slate-50 transition-colors">
					<i class="fas fa-sync-alt mr-2"></i>Yenile
				</button>
			</div>
		</header>

		<!-- Content -->
		<section class="flex-1 overflow-auto p-6">
			<div class="max-w-6xl mx-auto space-y-6">
				
				<!-- Upload Section -->
				<div class="bg-white border border-slate-200 rounded-2xl overflow-hidden">
					<div class="px-6 py-4 border-b border-slate-200 bg-gradient-to-r from-brand-50 to-blue-50">
						<h2 class="text-sm font-bold text-slate-700 uppercase tracking-wider flex items-center gap-2">
							<i class="fas fa-upload text-brand-600"></i>
							Yeni Şablon Yükle
						</h2>
					</div>
					<div class="p-6">
						<form id="docgenTemplateUploadForm" class="grid grid-cols-1 md:grid-cols-2 gap-4">
							<div class="md:col-span-2">
								<label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">Dosya (DOCX veya PPTX)</label>
								<input id="docgenTemplateFile" type="file" accept=".docx,.pptx" required class="w-full text-sm bg-slate-50 border border-slate-200 rounded-xl px-4 py-3">
							</div>
							
							<div>
								<label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">Şablon Adı</label>
								<input id="docgenTemplateName" type="text" placeholder="Örn: Standart Sözleşme" required class="w-full text-sm bg-slate-50 border border-slate-200 rounded-xl px-4 py-3">
							</div>
							
							<div>
								<label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">Kategori</label>
								<select id="docgenTemplateCategory" class="w-full text-sm bg-slate-50 border border-slate-200 rounded-xl px-4 py-3">
									<option value="">Kategori seçin</option>
									<option value="contract">📄 Sözleşme</option>
									<option value="quote">💰 Teklif</option>
									<option value="invoice">🧾 Fatura</option>
									<option value="report">📊 Rapor</option>
									<option value="other">📋 Diğer</option>
								</select>
							</div>
							
							<div>
								<label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">Nesne Tipi</label>
								<select id="docgenObjectType" class="w-full text-sm bg-slate-50 border border-slate-200 rounded-xl px-4 py-3">
									<option value="deal">Deal</option>
									<option value="contact">Contact</option>
									<option value="company">Company</option>
									<option value="quote">Quote</option>
								</select>
							</div>
							
							<div>
								<label class="flex items-center gap-2 text-sm text-slate-700 h-full pt-6">
									<input id="docgenIsDefault" type="checkbox" class="accent-brand-600 w-4 h-4">
									<span class="font-semibold">Varsayılan şablon olarak ayarla</span>
								</label>
							</div>
							
							<div class="md:col-span-2">
								<label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">Açıklama (Opsiyonel)</label>
								<textarea id="docgenTemplateDesc" rows="2" placeholder="Şablon hakkında kısa açıklama..." class="w-full text-sm bg-slate-50 border border-slate-200 rounded-xl px-4 py-3"></textarea>
							</div>
							
							<div class="md:col-span-2">
								<button type="submit" class="w-full px-6 py-3 bg-gradient-to-r from-brand-600 to-blue-600 text-white rounded-xl text-sm font-bold hover:from-brand-700 hover:to-blue-700 transition-all shadow-sm">
									<i class="fas fa-upload mr-2"></i>Şablonu Yükle
								</button>
							</div>
						</form>
						
						<div class="mt-4 text-xs text-slate-600 bg-blue-50 border border-blue-200 rounded-lg p-3">
							<i class="fas fa-info-circle mr-1 text-blue-600"></i>
							<strong>Placeholder Kullanımı:</strong> Şablonunuzda {% raw %}{{deal.name}}, {{contact.email}}, {{company.name}}{% endraw %} gibi değişkenler kullanabilirsiniz.
						</div>
					</div>
				</div>

				<!-- Filter Section -->
				<div class="bg-white border border-slate-200 rounded-xl p-4">
					<div class="flex items-center gap-3">
						<label class="text-sm font-semibold text-slate-700">Filtrele:</label>
						<select id="templateCategoryFilter" class="text-sm bg-slate-50 border border-slate-200 rounded-lg px-3 py-2">
							<option value="">Tüm Kategoriler</option>
							<option value="contract">Sözleşme</option>
							<option value="quote">Teklif</option>
							<option value="invoice">Fatura</option>
							<option value="report">Rapor</option>
							<option value="other">Diğer</option>
						</select>
					</div>
				</div>

				<!-- Templates List -->
				<div class="bg-white border border-slate-200 rounded-2xl overflow-hidden">
					<div class="px-6 py-4 border-b border-slate-200">
						<h2 class="text-sm font-bold text-slate-700 uppercase tracking-wider">Yüklü Şablonlar</h2>
					</div>
					<div id="docgenTemplateList" class="divide-y divide-slate-100">
						<div class="p-8 text-center text-sm text-slate-500">
							<i class="fas fa-spinner fa-spin text-2xl mb-2"></i>
							<p>Yükleniyor...</p>
						</div>
					</div>
				</div>

			</div>
		</section>
	</main>

	<script src="{{ url_for('static', filename='action-bell.js') }}"></script>
	<script src="/static/topbar-global.js"></script>
	<script src="/static/docgen.js"></script>
	<script>
		// Refresh button
		document.getElementById('refreshBtn').addEventListener('click', () => {
			if (window.loadDocgenTemplates) {
				window.loadDocgenTemplates();
			}
		});

		// Category filter
		document.getElementById('templateCategoryFilter').addEventListener('change', () => {
			if (window.loadDocgenTemplates) {
				window.loadDocgenTemplates();
			}
		});

		// Load templates on page load
		document.addEventListener('DOMContentLoaded', () => {
			if (window.loadDocgenTemplates) {
				window.loadDocgenTemplates();
			}
		});
	</script>
{% include '_ai_sidebar.html' %}
</body>
</html>

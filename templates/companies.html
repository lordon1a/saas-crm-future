    <script>
        let allCompanies = [];

        async function loadCompanies() {
            const loading = document.getElementById('loadingState');
            loading.classList.remove('hidden');
            
            try {
                const search = document.getElementById('searchInput').value.trim();
                const industry = document.getElementById('industryFilter').value;
                const size = document.getElementById('sizeFilter').value;
                
                let url = '/api/v1/companies?';
                if (search) url += `search=${encodeURIComponent(search)}&`;
                if (industry) url += `industry=${encodeURIComponent(industry)}&`;
                if (size) url += `size=${encodeURIComponent(size)}&`;
                
                const res = await fetch(url);
                const data = await res.json();
                allCompanies = data.companies;
                
                renderCompanies(allCompanies);
                document.getElementById('companyCount').textContent = allCompanies.length;
            } catch (e) {
                console.error(e);
                showToast('�?irketler yüklenirken bir hata oluştu.', 'error');
            } finally {
                loading.classList.add('hidden');
            }
        }

        function renderCompanies(companies) {
            const grid = document.getElementById('companiesGrid');
            grid.innerHTML = '';

            companies.forEach(c => {
                const card = document.createElement('div');
                card.className = 'bg-white rounded-2xl border border-slate-200 p-6 hover:shadow-lg transition-all cursor-pointer';
                card.onclick = () => viewCompany(c.id);
                
                const initials = c.name.substring(0, 2).toUpperCase();
                
                card.innerHTML = `
                    <div class="flex items-start justify-between mb-4">
                        <div class="flex items-center gap-3">
                            <div class="w-12 h-12 rounded-xl bg-brand-50 text-brand-600 flex items-center justify-center font-bold text-sm">
                                ${initials}
                            </div>
                            <div>
                                <h3 class="text-base font-bold text-slate-800 line-clamp-1">${c.name}</h3>
                                <p class="text-xs text-slate-400">${c.industry || 'Sektör belirtilmemiş'}</p>
                            </div>
                        </div>
                    </div>
                    <div class="space-y-2 text-sm">
                        ${c.website ? `<div class="flex items-center gap-2 text-slate-600">
                            <i class="fas fa-globe w-4"></i>
                            <span class="truncate">${c.website}</span>
                        </div>` : ''}
                        ${c.phone ? `<div class="flex items-center gap-2 text-slate-600">
                            <i class="fas fa-phone w-4"></i>
                            <span>${c.phone}</span>
                        </div>` : ''}
                        ${c.size ? `<div class="flex items-center gap-2 text-slate-600">
                            <i class="fas fa-users w-4"></i>
                            <span>${c.size} çalışan</span>
                        </div>` : ''}
                    </div>
                `;
                
                grid.appendChild(card);
            });
        }

        let currentCompany = null;
        let companyCustomFields = [];

        function viewCompany(id) {
            const company = allCompanies.find(c => c.id === id);
            if (!company) return;
            
            currentCompany = company;
            
            // Show modal
            const modal = document.getElementById('companyDetailModal');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
            
            // Set header
            document.getElementById('companyDetailName').textContent = company.name;
            document.getElementById('companyDetailIndustry').textContent = company.industry || 'Sektör belirtilmemiş';
            
            // Load custom fields and render
            loadCompanyCustomFields(id);
        }

        function closeCompanyDetailModal() {
            document.getElementById('companyDetailModal').classList.add('hidden');
            document.getElementById('companyDetailModal').classList.remove('flex');
            currentCompany = null;
        }

        async function loadCompanyCustomFields(companyId) {
            try {
                // Load custom field definitions
                const fieldsRes = await fetch('/api/v1/custom-fields?entity_type=company');
                const fields = await fieldsRes.json();
                
                // Load custom field values
                const valuesRes = await fetch(`/api/v1/custom-fields/values/company/${companyId}`);
                const values = await valuesRes.json();
                
                companyCustomFields = fields;
                renderCompanyDetail(values);
            } catch (e) {
                console.error(e);
                renderCompanyDetail({});
            }
        }

        function renderCompanyDetail(customFieldValues) {
            const container = document.getElementById('companyDetailContent');
            
            let html = `
                <div class="bg-slate-50 rounded-xl p-4 space-y-3">
                    <h4 class="text-xs font-bold text-slate-500 uppercase tracking-wider">Temel Bilgiler</h4>
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <p class="text-xs text-slate-400 mb-1">Website</p>
                            <p class="text-sm text-slate-700">${currentCompany.website ? `<a href="${currentCompany.website}" target="_blank" class="text-brand-600 hover:underline">${currentCompany.website}</a>` : '-'}</p>
                        </div>
                        <div>
                            <p class="text-xs text-slate-400 mb-1">Telefon</p>
                            <p class="text-sm text-slate-700">${currentCompany.phone || '-'}</p>
                        </div>
                        <div>
                            <p class="text-xs text-slate-400 mb-1">Sektör</p>
                            <p class="text-sm text-slate-700">${currentCompany.industry || '-'}</p>
                        </div>
                        <div>
                            <p class="text-xs text-slate-400 mb-1">Çalışan Sayısı</p>
                            <p class="text-sm text-slate-700">${currentCompany.size || '-'}</p>
                        </div>
                        ${currentCompany.address ? `
                        <div class="col-span-2">
                            <p class="text-xs text-slate-400 mb-1">Adres</p>
                            <p class="text-sm text-slate-700">${currentCompany.address}</p>
                        </div>
                        ` : ''}
                    </div>
                </div>
            `;
            
            // Custom fields section
            if (companyCustomFields.length > 0) {
                html += `
                    <div class="bg-slate-50 rounded-xl p-4 space-y-3">
                        <h4 class="text-xs font-bold text-slate-500 uppercase tracking-wider">Özel Alanlar</h4>
                        <div class="space-y-3">
                `;
                
                companyCustomFields.forEach(field => {
                    const value = customFieldValues[field.field_name];
                    html += renderCustomFieldInput(field, value);
                });
                
                html += `
                        </div>
                        <button onclick="saveCompanyCustomFields()" class="w-full mt-4 py-2.5 bg-brand-600 text-white font-bold rounded-xl hover:bg-brand-700 transition-colors">
                            <i class="fas fa-save mr-2"></i>Özel Alanları Kaydet
                        </button>
                    </div>
                `;
            }
            
            container.innerHTML = html;
        }

        function renderCustomFieldInput(field, value) {
            const fieldId = `custom_field_${field.id}`;
            let input = '';
            
            if (field.field_type === 'text') {
                input = `<input type="text" id="${fieldId}" value="${value || ''}" class="w-full px-4 py-2.5 bg-white border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-brand-500" ${field.is_required ? 'required' : ''}>`;
            } else if (field.field_type === 'number') {
                input = `<input type="number" id="${fieldId}" value="${value || ''}" class="w-full px-4 py-2.5 bg-white border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-brand-500" ${field.is_required ? 'required' : ''}>`;
            } else if (field.field_type === 'date') {
                input = `<input type="date" id="${fieldId}" value="${value || ''}" class="w-full px-4 py-2.5 bg-white border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-brand-500" ${field.is_required ? 'required' : ''}>`;
            } else if (field.field_type === 'checkbox') {
                const checked = value === true || value === 'true' ? 'checked' : '';
                input = `<label class="flex items-center gap-2 cursor-pointer">
                    <input type="checkbox" id="${fieldId}" ${checked} class="w-4 h-4 text-brand-600 border-slate-300 rounded focus:ring-brand-500">
                    <span class="text-sm text-slate-600">Evet</span>
                </label>`;
            } else if (field.field_type === 'dropdown') {
                const options = field.options ? JSON.parse(field.options) : [];
                input = `<select id="${fieldId}" class="w-full px-4 py-2.5 bg-white border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-brand-500" ${field.is_required ? 'required' : ''}>
                    <option value="">Seçiniz</option>
                    ${options.map(opt => `<option value="${opt}" ${value === opt ? 'selected' : ''}>${opt}</option>`).join('')}
                </select>`;
            } else if (field.field_type === 'multi_select') {
                const options = field.options ? JSON.parse(field.options) : [];
                const selectedValues = Array.isArray(value) ? value : [];
                input = `<div class="space-y-2">
                    ${options.map(opt => {
                        const checked = selectedValues.includes(opt) ? 'checked' : '';
                        return `<label class="flex items-center gap-2 cursor-pointer">
                            <input type="checkbox" name="${fieldId}" value="${opt}" ${checked} class="w-4 h-4 text-brand-600 border-slate-300 rounded focus:ring-brand-500">
                            <span class="text-sm text-slate-600">${opt}</span>
                        </label>`;
                    }).join('')}
                </div>`;
            }
            
            return `
                <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">
                        ${field.field_name}${field.is_required ? ' *' : ''}
                    </label>
                    ${input}
                </div>
            `;
        }

        async function saveCompanyCustomFields() {
            if (!currentCompany) return;
            
            try {
                const promises = [];
                
                for (const field of companyCustomFields) {
                    const fieldId = `custom_field_${field.id}`;
                    let value;
                    
                    if (field.field_type === 'checkbox') {
                        value = document.getElementById(fieldId)?.checked || false;
                    } else if (field.field_type === 'multi_select') {
                        const checkboxes = document.querySelectorAll(`input[name="${fieldId}"]:checked`);
                        value = Array.from(checkboxes).map(cb => cb.value);
                    } else {
                        value = document.getElementById(fieldId)?.value || '';
                    }
                    
                    promises.push(
                        fetch('/api/v1/custom-fields/values', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                custom_field_id: field.id,
                                entity_id: currentCompany.id,
                                value: value
                            })
                        })
                    );
                }
                
                await Promise.all(promises);
                showToast('Özel alanlar kaydedildi', 'success');
            } catch (e) {
                console.error(e);
                showToast('Kaydetme başarısız', 'error');
            }
        }

        async function exportCompanies() {
            try {
                const search = document.getElementById('searchInput').value.trim();
                const industry = document.getElementById('industryFilter').value;
                const size = document.getElementById('sizeFilter').value;
                
                let url = '/api/v1/companies/export?';
                if (search) url += `search=${encodeURIComponent(search)}&`;
                if (industry) url += `industry=${encodeURIComponent(industry)}&`;
                if (size) url += `size=${encodeURIComponent(size)}&`;
                
                window.location.href = url;
            } catch (e) {
                showToast('CSV indirme başarısız oldu.', 'error');
            }
        }

        async function deleteAllCompaniesConfirm() {
            const total = document.getElementById('companyCount')?.textContent || '?';
            if (!confirm(`TÜM ${total} ŞİRKETİ silmek istediğinizden emin misiniz? Bu işlem GERİ ALINAMAZ!`)) return;
            if (!confirm('Son onay: Tüm şirketler kalıcı olarak silinecek. Devam?')) return;
            
            try {
                const res = await fetch('/api/v1/companies/bulk-delete-all', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'}
                });
                
                if (!res.ok) throw new Error('Silme başarısız');
                
                const data = await res.json();
                showToast(`${data.deleted_count || total} şirket silindi`, 'success');
                if (typeof loadCompanies === 'function') {
                    await loadCompanies(1);
                } else {
                    window.location.reload();
                }
            } catch(e) {
                showToast('Silme işlemi başarısız', 'error');
            }
        }

        function openNewCompanyModal() {
            document.getElementById('newCompanyModal').classList.remove('hidden');
            document.getElementById('newCompanyModal').classList.add('flex');
            document.getElementById('newName').focus();
        }

        function closeNewCompanyModal() {
            document.getElementById('newCompanyModal').classList.add('hidden');
            document.getElementById('newCompanyModal').classList.remove('flex');
            document.getElementById('newCompanyForm').reset();
        }

        function openEditCompanyModal() {
            if (!currentCompany) return;
            
            // Populate form with current company data
            document.getElementById('editName').value = currentCompany.name || '';
            document.getElementById('editIndustry').value = currentCompany.industry || '';
            document.getElementById('editSize').value = currentCompany.size || '';
            document.getElementById('editWebsite').value = currentCompany.website || '';
            document.getElementById('editPhone').value = currentCompany.phone || '';
            document.getElementById('editAddress').value = currentCompany.address || '';
            
            // Show edit modal
            document.getElementById('editCompanyModal').classList.remove('hidden');
            document.getElementById('editCompanyModal').classList.add('flex');
        }

        function closeEditCompanyModal() {
            document.getElementById('editCompanyModal').classList.add('hidden');
            document.getElementById('editCompanyModal').classList.remove('flex');
            document.getElementById('editCompanyForm').reset();
        }

        document.getElementById('editCompanyForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            if (!currentCompany) return;
            
            const payload = {
                name: document.getElementById('editName').value.trim(),
                industry: document.getElementById('editIndustry').value,
                size: document.getElementById('editSize').value,
                website: document.getElementById('editWebsite').value.trim(),
                phone: document.getElementById('editPhone').value.trim(),
                address: document.getElementById('editAddress').value.trim()
            };

            try {
                const res = await fetch(`/api/v1/companies/${currentCompany.id}`, {
                    method: 'PATCH',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (res.ok) {
                    showToast('Şirket başarıyla güncellendi.', 'success');
                    closeEditCompanyModal();
                    closeCompanyDetailModal();
                    loadCompanies();
                } else {
                    const data = await res.json();
                    showToast(data.error || 'Güncelleme başarısız.', 'error');
                }
            } catch (e) {
                showToast('Bağlantı hatası.', 'error');
            }
        });

        async function deleteCompany() {
            if (!currentCompany) return;
            
            if (!confirm(`"${currentCompany.name}" şirketini silmek istediğinizden emin misiniz? Bu işlem geri alınamaz.`)) {
                return;
            }

            try {
                const res = await fetch(`/api/v1/companies/${currentCompany.id}`, {
                    method: 'DELETE'
                });

                if (res.ok) {
                    showToast('Şirket başarıyla silindi.', 'success');
                    closeCompanyDetailModal();
                    loadCompanies();
                } else {
                    const data = await res.json();
                    showToast(data.error || 'Silme başarısız.', 'error');
                }
            } catch (e) {
                showToast('Bağlantı hatası.', 'error');
            }
        }

        document.getElementById('newCompanyForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const payload = {
                name: document.getElementById('newName').value.trim(),
                industry: document.getElementById('newIndustry').value,
                size: document.getElementById('newSize').value,
                website: document.getElementById('newWebsite').value.trim(),
                phone: document.getElementById('newPhone').value.trim(),
                address: document.getElementById('newAddress').value.trim()
            };

            try {
                const res = await fetch('/api/v1/companies', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (res.ok) {
                    showToast('Yeni şirket başarıyla eklendi.', 'success');
                    closeNewCompanyModal();
                    loadCompanies();
                } else {
                    const data = await res.json();
                    showToast(data.error || 'Hata oluştu.', 'error');
                }
            } catch (e) {
                showToast('Bağlantı hatası.', 'error');
            }
        });

        function showToast(msg, type = 'success') {
            const toast = document.createElement('div');
            toast.className = `fixed top-4 right-4 ${type === 'success' ? 'bg-emerald-500' : 'bg-red-500'} text-white px-6 py-3 rounded-xl shadow-lg z-[100]`;
            toast.innerHTML = `<i class="fas ${type === 'success' ? 'fa-check-circle' : 'fa-exclamation-circle'} mr-2"></i>${msg}`;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }

        // Arama için debounce
        let searchTimeout;
        document.getElementById('searchInput').addEventListener('input', () => {
            clearTimeout(searchTimeout);
            searchTimeout = setTimeout(loadCompanies, 500);
        });

        document.getElementById('industryFilter').addEventListener('change', loadCompanies);
        document.getElementById('sizeFilter').addEventListener('change', loadCompanies);

        window.onclick = (e) => {
            if (e.target.id === 'newCompanyModal') closeNewCompanyModal();
            if (e.target.id === 'editCompanyModal') closeEditCompanyModal();
            if (e.target.id === 'companyDetailModal') closeCompanyDetailModal();
        }

        loadCompanies();
    </script>
    <script src="/static/topbar-global.js"></script>
</body>
</html>

                <main class="flex-1 flex flex-col overflow-hidden">
<header class="bg-white border-b border-gray-200 px-4 md:px-8 py-3 flex-shrink-0">
            <div class="grid grid-cols-1 lg:grid-cols-[220px_minmax(420px,1fr)_360px] items-center gap-3 md:gap-4">
                <div class="hidden lg:block"></div>
                <div class="relative w-full max-w-3xl justify-self-center">
                    <i class="fas fa-search absolute left-3.5 top-1/2 -translate-y-1/2 text-gray-400 text-sm"></i>
                    <input type="text" data-topbar-search placeholder="Pipedrive'da ara" class="w-full pl-10 pr-4 py-2.5 bg-white border border-gray-300 rounded-full text-sm focus:outline-none focus:ring-2 focus:ring-brand-500/20 focus:border-brand-500 transition-all">
                </div>
                <div class="flex items-center gap-1.5 md:gap-2 justify-self-end">
                    <button class="hidden md:flex w-9 h-9 rounded-full text-gray-500 hover:bg-gray-100 transition-all items-center justify-center" title="Hediye">
                        <i class="fas fa-gift text-sm"></i>
                    </button>
                    <button class="hidden md:flex w-9 h-9 rounded-full text-gray-500 hover:bg-gray-100 transition-all items-center justify-center" title="Yardim">
                        <i class="fas fa-circle-question text-sm"></i>
                    </button>
                    <button class="hidden md:flex w-9 h-9 rounded-full text-gray-500 hover:bg-gray-100 transition-all items-center justify-center" title="Ipuclari">
                        <i class="fas fa-lightbulb text-sm"></i>
                    </button>
                    <div class="relative">
                        <button data-topbar-menu-button class="h-10 pl-2.5 pr-2 rounded-full border border-gray-300 bg-white hover:bg-gray-50 transition-all flex items-center gap-2">

                            <span data-topbar-name class="hidden md:block text-xs font-semibold text-gray-700 max-w-[80px] truncate">Yigit</span>
                            <i class="fas fa-chevron-down text-[10px] text-gray-500"></i>
                        </button>
                        <div data-topbar-menu class="hidden absolute right-0 top-12 w-72 bg-white border border-gray-200 rounded-xl shadow-xl py-2 z-50">
                            <div data-topbar-menu-content></div>
                        </div>
                    </div>
                </div>
            </div>
        </header>
        <header class="h-16 bg-white border-b border-slate-200 px-8 flex items-center justify-between z-20 flex-shrink-0">
            <div class="flex items-center gap-4">
                <h1 class="text-xl font-bold text-slate-800">Görevler & Projeler</h1>
                <div class="flex items-center gap-2 pl-4 border-l border-slate-200">
                    <span class="w-2 h-2 rounded-full bg-emerald-500"></span>
                    <span class="text-xs font-semibold text-slate-400" id="tasksLiveInfo">Canlı</span>
                </div>
            </div>
            <div class="flex items-center gap-3">
                <button id="refreshTasksBtn" class="p-2 text-slate-400 hover:text-brand-600 hover:bg-brand-50 rounded-lg transition-colors" title="Yenile">
                    <i class="fas fa-sync-alt"></i>
                </button>
                <button onclick="openMilestoneModal()" class="px-4 py-2 bg-white border border-slate-200 rounded-xl text-sm font-semibold text-slate-600 hover:bg-slate-50 transition-colors">
                    <i class="fas fa-flag mr-2"></i> Yeni Milestone
                </button>
                <button onclick="openTaskModal()" class="px-4 py-2 bg-brand-600 text-white rounded-xl text-sm font-bold hover:bg-brand-700 transition-colors shadow-sm">
                    <i class="fas fa-plus mr-2"></i> Yeni Görev
                </button>
            </div>
        </header>

        <section class="bg-white border-b border-slate-200 px-8 py-4 grid grid-cols-1 md:grid-cols-4 gap-4 flex-shrink-0">
            <div class="rounded-2xl border border-slate-200 p-4 bg-slate-50">
                <p class="text-xs font-bold text-slate-400 uppercase tracking-widest mb-1">Toplam Görev</p>
                <p class="text-2xl font-bold text-slate-800" id="statsTotalTasks">0</p>
            </div>
            <div class="rounded-2xl border border-slate-200 p-4 bg-slate-50">
                <p class="text-xs font-bold text-slate-400 uppercase tracking-widest mb-1">Devam Eden</p>
                <p class="text-2xl font-bold text-brand-600" id="statsInProgress">0</p>
            </div>
            <div class="rounded-2xl border border-slate-200 p-4 bg-slate-50">
                <p class="text-xs font-bold text-slate-400 uppercase tracking-widest mb-1">Tamamlanan</p>
                <p class="text-2xl font-bold text-emerald-600" id="statsCompleted">0</p>
            </div>
            <div class="rounded-2xl border border-slate-200 p-4 bg-slate-50">
                <p class="text-xs font-bold text-slate-400 uppercase tracking-widest mb-1">Geciken</p>
                <p class="text-2xl font-bold text-rose-600" id="statsOverdue">0</p>
            </div>
        </section>

        <section class="bg-white border-b border-slate-200 px-8 py-4 flex-shrink-0">
            <div class="flex items-center justify-between mb-3">
                <h2 class="text-sm font-bold text-slate-700 uppercase tracking-wider">Milestones</h2>
                <span class="text-xs text-slate-500" id="milestoneCount">0 milestone</span>
            </div>
            <div id="milestonesGrid" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-3"></div>
        </section>

        <section class="bg-white border-b border-slate-200 px-8 py-4 flex-shrink-0">
            <div class="flex flex-col lg:flex-row lg:items-center gap-3">
                <div class="relative flex-1 max-w-md">
                    <i class="fas fa-search absolute left-4 top-1/2 -translate-y-1/2 text-slate-400"></i>
                    <input type="text" id="filter-search" placeholder="Görev adı veya açıklama ara..."
                        class="w-full pl-10 pr-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-brand-500/20 focus:border-brand-500 transition-all">
                </div>

                <select id="filter-status" class="bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm outline-none focus:border-brand-500">
                    <option value="">Tüm Durumlar</option>
                    <option value="not_started">Not Started</option>
                    <option value="in_progress">In Progress</option>
                    <option value="blocked">Blocked</option>
                    <option value="completed">Completed</option>
                    <option value="cancelled">Cancelled</option>
                </select>

                <select id="filter-priority" class="bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm outline-none focus:border-brand-500">
                    <option value="">Tüm Öncelikler</option>
                    <option value="urgent">Urgent</option>
                    <option value="high">High</option>
                    <option value="medium">Medium</option>
                    <option value="low">Low</option>
                </select>

                <select id="filter-milestone" class="bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm outline-none focus:border-brand-500">
                    <option value="">Tüm Milestones</option>
                </select>

                <label class="flex items-center gap-2 px-3 py-2 border border-slate-200 rounded-xl bg-slate-50 text-sm text-slate-600 cursor-pointer">
                    <input type="checkbox" id="filter-customer-facing" class="accent-brand-600">
                    Müşteri görünür
                </label>

                <div class="flex items-center gap-2 lg:ml-auto">
                    <button id="viewListBtn" class="px-3 py-2 rounded-xl text-sm font-semibold bg-brand-50 text-brand-600 border border-brand-100">Liste</button>
                    <button id="viewGanttBtn" class="px-3 py-2 rounded-xl text-sm font-semibold bg-white text-slate-600 border border-slate-200">Gantt</button>
                </div>
            </div>
        </section>

        <section class="flex-1 overflow-auto p-8">
            <div id="taskListView" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-4"></div>
            <div id="ganttView" class="hidden bg-white rounded-2xl border border-slate-200 overflow-x-auto">
                <div id="ganttContent" class="min-w-[900px]"></div>
            </div>
        </section>
    </main>

    <div id="taskModal" class="hidden fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 items-center justify-center p-4">
        <div class="bg-white rounded-3xl shadow-2xl w-full max-w-4xl max-h-[90vh] overflow-hidden flex flex-col">
            <div class="px-8 py-6 border-b border-slate-200 flex items-center justify-between">
                <h3 id="taskModalTitle" class="text-lg font-bold text-slate-800">Yeni Görev</h3>
                <button onclick="closeTaskModal()" class="text-slate-400 hover:text-slate-600"><i class="fas fa-times"></i></button>
            </div>

            <div class="overflow-y-auto p-8 grid grid-cols-1 xl:grid-cols-2 gap-8">
                <form id="taskForm" class="space-y-4">
                    <input type="hidden" id="task-id">

                    <div>
                        <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">Başlık *</label>
                        <input type="text" id="task-title" required class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-brand-500">
                    </div>

                    <div>
                        <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">Açıklama</label>
                        <textarea id="task-description" rows="4" class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-brand-500"></textarea>
                    </div>

                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">Öncelik</label>
                            <select id="task-priority" class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-brand-500">
                                <option value="low">Low</option>
                                <option value="medium" selected>Medium</option>
                                <option value="high">High</option>
                                <option value="urgent">Urgent</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">Durum</label>
                            <select id="task-status" class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-brand-500">
                                <option value="not_started" selected>Not Started</option>
                                <option value="in_progress">In Progress</option>
                                <option value="blocked">Blocked</option>
                                <option value="completed">Completed</option>
                                <option value="cancelled">Cancelled</option>
                            </select>
                        </div>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">Son Tarih</label>
                            <input type="datetime-local" id="task-due-date" class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-brand-500">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">Milestone</label>
                            <select id="task-milestone" class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-brand-500">
                                <option value="">None</option>
                            </select>
                        </div>
                    </div>

                    <div>
                        <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">Atanan Kişi</label>
                        <div id="task-assignment-selector"></div>
                    </div>

                    <label class="flex items-center gap-2 px-3 py-2 border border-slate-200 rounded-xl bg-slate-50 text-sm text-slate-600 cursor-pointer">
                        <input type="checkbox" id="task-customer-facing" class="accent-brand-600">
                        Müşteri portalında görünür
                    </label>

                    <div class="flex items-center gap-3 pt-4">
                        <button type="submit" class="px-5 py-2.5 bg-brand-600 text-white rounded-xl text-sm font-bold hover:bg-brand-700 transition-colors">Kaydet</button>
                        <button type="button" onclick="closeTaskModal()" class="px-5 py-2.5 bg-slate-100 text-slate-600 rounded-xl text-sm font-bold hover:bg-slate-200 transition-colors">İptal</button>
                        <button type="button" id="deleteTaskBtn" onclick="deleteCurrentTask()" class="hidden ml-auto px-5 py-2.5 bg-rose-50 text-rose-600 rounded-xl text-sm font-bold hover:bg-rose-100 transition-colors">Sil</button>
                    </div>
                </form>

                <div id="taskDetailPanels" class="space-y-4 hidden">
                    <div class="border border-slate-200 rounded-2xl p-4">
                        <div class="flex items-center justify-between mb-3">
                            <h4 class="text-sm font-bold text-slate-700">Bağımlılıklar</h4>
                        </div>
                        <div class="flex gap-2 mb-3">
                            <select id="dependency-select" class="flex-1 px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-brand-500">
                                <option value="">Bağımlı görev seç</option>
                            </select>
                            <button type="button" onclick="addDependency()" class="px-3 py-2 bg-slate-100 text-slate-700 rounded-xl text-sm font-semibold hover:bg-slate-200">Ekle</button>
                        </div>
                        <div id="dependencies-list" class="space-y-2"></div>
                    </div>

                    <div class="border border-slate-200 rounded-2xl p-4">
                        <h4 class="text-sm font-bold text-slate-700 mb-3">Yorumlar</h4>
                        <div class="flex gap-2 mb-3">
                            <input id="comment-input" type="text" placeholder="Yorum ekle..." class="flex-1 px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-brand-500">
                            <button type="button" onclick="addComment()" class="px-3 py-2 bg-slate-100 text-slate-700 rounded-xl text-sm font-semibold hover:bg-slate-200">Gönder</button>
                        </div>
                        <div id="comments-list" class="space-y-2 max-h-40 overflow-auto"></div>
                    </div>

                    <div class="border border-slate-200 rounded-2xl p-4">
                        <h4 class="text-sm font-bold text-slate-700 mb-3">Ekler</h4>
                        <div class="flex gap-2 mb-3">
                            <input type="file" id="attachment-file" class="flex-1 text-sm text-slate-600 file:mr-3 file:px-3 file:py-2 file:rounded-lg file:border-0 file:bg-slate-100 file:text-slate-700 file:font-semibold hover:file:bg-slate-200">
                            <button type="button" onclick="uploadAttachment()" class="px-3 py-2 bg-slate-100 text-slate-700 rounded-xl text-sm font-semibold hover:bg-slate-200">Yükle</button>
                        </div>
                        <div id="attachments-list" class="space-y-2 max-h-36 overflow-auto"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="milestoneModal" class="hidden fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 items-center justify-center p-4">
        <div class="bg-white rounded-3xl shadow-2xl w-full max-w-lg overflow-hidden">
            <div class="px-8 py-6 border-b border-slate-200 flex items-center justify-between">
                <h3 class="text-lg font-bold text-slate-800">Yeni Milestone</h3>
                <button onclick="closeMilestoneModal()" class="text-slate-400 hover:text-slate-600"><i class="fas fa-times"></i></button>
            </div>
            <form id="milestoneForm" class="p-8 space-y-4">
                <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">Ad *</label>
                    <input type="text" id="milestone-name" required class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-brand-500">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">Son Tarih</label>
                    <input type="datetime-local" id="milestone-due-date" class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-brand-500">
                </div>
                <div class="flex gap-3 pt-2">
                    <button type="button" onclick="closeMilestoneModal()" class="flex-1 py-3 bg-slate-100 text-slate-600 font-bold rounded-xl hover:bg-slate-200 transition-colors">İptal</button>
                    <button type="submit" class="flex-1 py-3 bg-brand-600 text-white font-bold rounded-xl hover:bg-brand-700 transition-colors">Kaydet</button>
                </div>
            </form>
        </div>
    </div>

    <div id="toastContainer" class="fixed right-4 bottom-4 z-[100] space-y-2"></div>

    <script src="{{ url_for('static', filename='tasks.js') }}"></script>
    <script src="/static/topbar-global.js"></script>
    <script src="/static/team-selector.js"></script>
    <script>
        // Initialize team member selector for task assignment
        let taskAssignmentSelector = null;
        
        document.addEventListener('DOMContentLoaded', async () => {
            taskAssignmentSelector = new TeamMemberSelector('task-assignment-selector', {
                includeUnassigned: true,
                placeholder: 'Atama yapın'
            });
            await taskAssignmentSelector.init();
        });
        
        // Helper to get selected assignee from team selector
        function getTaskAssignee() {
            return taskAssignmentSelector ? taskAssignmentSelector.getValue() : null;
        }
        
        // Helper to set assignee in team selector
        function setTaskAssignee(assigneeId) {
            if (taskAssignmentSelector) {
                taskAssignmentSelector.setValue(assigneeId);
            }
        }
    </script>
</body>

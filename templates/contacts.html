<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhatsApp CRM - Kişiler</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['"Inter"', 'sans-serif'] },
                    colors: { brand: { 50: '#f5f3ff', 100: '#ede9fe', 500: '#8b5cf6', 600: '#7c3aed', 900: '#4c1d95' } }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-50 text-slate-800 h-screen overflow-hidden flex font-sans antialiased">
    <!-- Sidebar -->
    <aside class="w-16 bg-white border-r border-slate-200 flex flex-col items-center py-6 z-30 relative shadow-sm flex-shrink-0">
        <a href="/" class="w-10 h-10 bg-brand-600 rounded-xl flex items-center justify-center text-white text-xl shadow-lg mb-8 hover:scale-105 transition-transform" title="Ana Sayfa">
            <i class="fab fa-whatsapp"></i>
        </a>
        <nav class="flex-1 flex flex-col gap-4 w-full px-3">
            <a href="/" class="w-10 h-10 flex items-center justify-center text-slate-400 hover:text-brand-600 hover:bg-brand-50 rounded-xl transition-all" title="Gelen Kutusu">
                <i class="fas fa-inbox text-lg"></i>
            </a>
            <a href="/analytics" class="w-10 h-10 flex items-center justify-center text-slate-400 hover:text-brand-600 hover:bg-brand-50 rounded-xl transition-all" title="Raporlar">
                <i class="fas fa-chart-line text-lg"></i>
            </a>
            <a href="/contacts" class="w-10 h-10 flex items-center justify-center text-brand-600 bg-brand-50 rounded-xl shadow-sm transition-all" title="Kişiler">
                <i class="fas fa-address-book text-lg"></i>
            </a>
            <a href="/companies" class="w-10 h-10 flex items-center justify-center text-slate-400 hover:text-brand-600 hover:bg-brand-50 rounded-xl transition-all" title="Şirketler">
                <i class="fas fa-building text-lg"></i>
            </a>
            <a href="/broadcast" class="w-10 h-10 flex items-center justify-center text-slate-400 hover:text-brand-600 hover:bg-brand-50 rounded-xl transition-all" title="Toplu Mesaj">
                <i class="fas fa-bullhorn text-lg"></i>
            </a>
            <a href="/automation" class="w-10 h-10 flex items-center justify-center text-slate-400 hover:text-brand-600 hover:bg-brand-50 rounded-xl transition-all" title="Otomasyon">
                <i class="fas fa-robot text-lg"></i>
            </a>
            <a href="/pipeline" class="w-10 h-10 flex items-center justify-center text-slate-400 hover:text-brand-600 hover:bg-brand-50 rounded-xl transition-all" title="Pipeline">
                <i class="fas fa-chart-line text-lg"></i>
            </a>
            <a href="/tasks" class="w-10 h-10 flex items-center justify-center text-slate-400 hover:text-brand-600 hover:bg-brand-50 rounded-xl transition-all" title="Görevler">
                <i class="fas fa-list-check text-lg"></i>
            </a>
            <a href="/channels" class="w-10 h-10 flex items-center justify-center text-slate-400 hover:text-brand-600 hover:bg-brand-50 rounded-xl transition-all" title="Kanallar">
                <i class="fas fa-plug text-lg"></i>
            </a>
            <a href="/settings" class="w-10 h-10 flex items-center justify-center text-slate-400 hover:text-brand-600 hover:bg-brand-50 rounded-xl transition-all" title="Ayarlar">
                <i class="fas fa-cog text-lg"></i>
            </a>
        </nav>
        <div class="flex flex-col gap-4 w-full px-3 pb-4">
            <a href="/account" class="w-10 h-10 flex items-center justify-center text-slate-400 hover:text-brand-600 hover:bg-brand-50 rounded-xl transition-all" title="Hesap">
                <i class="fas fa-user text-lg"></i>
            </a>
            <a href="/logout" class="w-10 h-10 flex items-center justify-center text-slate-400 hover:text-red-500 hover:bg-red-50 rounded-xl transition-all" title="Çıkış Yap">
                <i class="fas fa-sign-out-alt text-lg"></i>
            </a>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 flex flex-col overflow-hidden">
        <!-- Top Bar -->
        <header class="h-16 bg-white border-b border-slate-200 px-8 flex items-center justify-between z-20 flex-shrink-0">
            <div class="flex items-center gap-4">
                <h1 class="text-xl font-bold text-slate-800">Kişiler</h1>
                <div class="flex items-center gap-2 pl-4 border-l border-slate-200">
                    <span class="text-sm text-slate-500"><span id="contactCount">0</span> kişi</span>
                </div>
            </div>
            <div class="flex items-center gap-3">
                <button onclick="exportContacts()" class="px-4 py-2 bg-white border border-slate-200 rounded-xl text-sm font-semibold text-slate-600 hover:bg-slate-50 transition-colors">
                    <i class="fas fa-download mr-2"></i> CSV İndir
                </button>
                <button onclick="openNewContactModal()" class="px-4 py-2 bg-brand-600 text-white rounded-xl text-sm font-bold hover:bg-brand-700 transition-colors shadow-sm">
                    <i class="fas fa-plus mr-2"></i> Yeni Kişi
                </button>
            </div>
        </header>

        <!-- Search Bar -->
        <div class="bg-white border-b border-slate-200 px-8 py-4 flex items-center gap-4 flex-shrink-0">
            <div class="relative flex-1 max-w-md">
                <i class="fas fa-search absolute left-4 top-1/2 -translate-y-1/2 text-slate-400"></i>
                <input type="text" id="searchInput" placeholder="İsim, email veya telefon ile ara..." 
                    class="w-full pl-10 pr-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-brand-500/20 focus:border-brand-500 transition-all">
            </div>
            <select id="roleFilter" class="bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm outline-none focus:border-brand-500">
                <option value="">Tüm Roller</option>
                <option value="Decision Maker">Decision Maker</option>
                <option value="Champion">Champion</option>
                <option value="Influencer">Influencer</option>
                <option value="Blocker">Blocker</option>
                <option value="User">User</option>
            </select>
        </div>

        <!-- Contacts Grid -->
        <div class="flex-1 overflow-auto p-8">
            <div id="contactsGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                <!-- JS ile doldurulacak -->
            </div>
            <div id="loadingState" class="hidden p-12 text-center">
                <i class="fas fa-spinner fa-spin text-2xl text-brand-600 mb-2"></i>
                <p class="text-slate-500 text-sm">Yükleniyor...</p>
            </div>
        </div>
    </main>

    <!-- New Contact Modal -->
    <div id="newContactModal" class="hidden fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 items-center justify-center p-4">
        <div class="bg-white rounded-3xl shadow-2xl w-full max-w-lg overflow-hidden">
            <div class="px-8 py-6 border-b border-slate-200 flex items-center justify-between">
                <h3 class="text-lg font-bold text-slate-800">Yeni Kişi Ekle</h3>
                <button onclick="closeNewContactModal()" class="text-slate-400 hover:text-slate-600"><i class="fas fa-times"></i></button>
            </div>
            <form id="newContactForm" class="p-8 space-y-4">
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">Ad *</label>
                        <input type="text" id="newFirstName" required placeholder="Ad" class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-brand-500">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">Soyad</label>
                        <input type="text" id="newLastName" placeholder="Soyad" class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-brand-500">
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">Email</label>
                    <input type="email" id="newEmail" placeholder="ornek@mail.com" class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-brand-500">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">Telefon</label>
                    <input type="tel" id="newPhone" placeholder="+90 5xx xxx xxxx" class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-brand-500">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">Şirket</label>
                    <select id="newCompanyId" class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-brand-500">
                        <option value="">Seçiniz</option>
                    </select>
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">Rol</label>
                        <select id="newRole" class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-brand-500">
                            <option value="">Seçiniz</option>
                            <option value="Decision Maker">Decision Maker</option>
                            <option value="Champion">Champion</option>
                            <option value="Influencer">Influencer</option>
                            <option value="Blocker">Blocker</option>
                            <option value="User">User</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">Unvan</label>
                        <input type="text" id="newJobTitle" placeholder="İş Unvanı" class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-brand-500">
                    </div>
                </div>
                <div class="flex gap-3 pt-4">
                    <button type="button" onclick="closeNewContactModal()" class="flex-1 py-3 bg-slate-100 text-slate-600 font-bold rounded-xl hover:bg-slate-200 transition-colors">İptal</button>
                    <button type="submit" class="flex-1 py-3 bg-brand-600 text-white font-bold rounded-xl hover:bg-brand-700 transition-colors">Kişiyi Kaydet</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        let allContacts = [];
        let allCompanies = [];

        // Get company_id from URL if present
        const urlParams = new URLSearchParams(window.location.search);
        const companyIdFilter = urlParams.get('company_id');

        async function loadCompanies() {
            try {
                const res = await fetch('/api/v1/companies');
                const data = await res.json();
                allCompanies = data.companies;
                
                const select = document.getElementById('newCompanyId');
                allCompanies.forEach(c => {
                    const option = document.createElement('option');
                    option.value = c.id;
                    option.textContent = c.name;
                    select.appendChild(option);
                });
            } catch (e) {
                console.error(e);
            }
        }

        async function loadContacts() {
            const loading = document.getElementById('loadingState');
            loading.classList.remove('hidden');
            
            try {
                const search = document.getElementById('searchInput').value.trim();
                const role = document.getElementById('roleFilter').value;
                
                let url = '/api/v1/contacts?';
                if (search) url += `search=${encodeURIComponent(search)}&`;
                if (role) url += `role=${encodeURIComponent(role)}&`;
                if (companyIdFilter) url += `company_id=${companyIdFilter}&`;
                
                const res = await fetch(url);
                const data = await res.json();
                allContacts = data.contacts;
                
                renderContacts(allContacts);
                document.getElementById('contactCount').textContent = allContacts.length;
                
                // Update header if filtering by company
                if (companyIdFilter && allContacts.length > 0 && allContacts[0].company_name) {
                    document.querySelector('h1').innerHTML = `Kişiler <span class="text-sm font-normal text-slate-500">/ ${allContacts[0].company_name}</span>`;
                }
            } catch (e) {
                console.error(e);
                showToast('Kişiler yüklenirken bir hata oluştu.', 'error');
            } finally {
                loading.classList.add('hidden');
            }
        }

        function renderContacts(contacts) {
            const grid = document.getElementById('contactsGrid');
            grid.innerHTML = '';

            contacts.forEach(c => {
                const card = document.createElement('div');
                card.className = 'bg-white rounded-2xl border border-slate-200 p-6 hover:shadow-lg transition-all';
                
                const initials = (c.first_name.substring(0, 1) + (c.last_name ? c.last_name.substring(0, 1) : '')).toUpperCase();
                
                const roleEmoji = {
                    'Decision Maker': '👑',
                    'Champion': '⭐',
                    'Influencer': '📊',
                    'Blocker': '🚫',
                    'User': '👤'
                }[c.role] || '👤';
                
                const roleColor = {
                    'Decision Maker': 'bg-purple-100 text-purple-700',
                    'Champion': 'bg-yellow-100 text-yellow-700',
                    'Influencer': 'bg-blue-100 text-blue-700',
                    'Blocker': 'bg-red-100 text-red-700',
                    'User': 'bg-slate-100 text-slate-600'
                }[c.role] || 'bg-slate-100 text-slate-600';
                
                card.innerHTML = `
                    <div class="flex items-start justify-between mb-4">
                        <div class="flex items-center gap-3">
                            <div class="w-12 h-12 rounded-xl bg-brand-50 text-brand-600 flex items-center justify-center font-bold text-sm">
                                ${initials}
                            </div>
                            <div>
                                <h3 class="text-base font-bold text-slate-800">${c.full_name}</h3>
                                <p class="text-xs text-slate-400">${c.job_title || 'Unvan belirtilmemiş'}</p>
                            </div>
                        </div>
                        <div class="flex items-center gap-2">
                            <span class="px-2 py-1 rounded-lg text-xs font-bold ${roleColor}">
                                ${roleEmoji} ${c.role || 'N/A'}
                            </span>
                        </div>
                    </div>
                    <div class="space-y-2 text-sm mb-4">
                        ${c.company_name ? `<div class="flex items-center gap-2 text-slate-600">
                            <i class="fas fa-building w-4"></i>
                            <span class="truncate">${c.company_name}</span>
                        </div>` : ''}
                        ${c.email ? `<div class="flex items-center gap-2 text-slate-600">
                            <i class="fas fa-envelope w-4"></i>
                            <span class="truncate">${c.email}</span>
                        </div>` : ''}
                        ${c.phone ? `<div class="flex items-center gap-2 text-slate-600">
                            <i class="fas fa-phone w-4"></i>
                            <span>${c.phone}</span>
                        </div>` : ''}
                    </div>
                    <div class="flex items-center justify-between pt-4 border-t border-slate-100">
                        <div class="flex items-center gap-2">
                            <span class="text-xs font-bold text-slate-400">Lead Score:</span>
                            <span class="px-2 py-1 rounded-lg text-xs font-bold ${c.lead_score >= 80 ? 'bg-green-100 text-green-700' : c.lead_score >= 50 ? 'bg-yellow-100 text-yellow-700' : 'bg-slate-100 text-slate-600'}">
                                ${c.lead_score}
                            </span>
                        </div>
                        <button onclick="viewContact(${c.id})" class="text-brand-600 hover:text-brand-700 text-sm font-semibold">
                            Detay <i class="fas fa-arrow-right ml-1"></i>
                        </button>
                    </div>
                `;
                
                grid.appendChild(card);
            });
        }

        function viewContact(id) {
            // TODO: Contact detail page
            showToast('Kişi detay sayfası yakında eklenecek', 'info');
        }

        async function exportContacts() {
            try {
                const search = document.getElementById('searchInput').value.trim();
                const role = document.getElementById('roleFilter').value;
                
                let url = '/api/v1/contacts/export?';
                if (search) url += `search=${encodeURIComponent(search)}&`;
                if (role) url += `role=${encodeURIComponent(role)}&`;
                
                window.location.href = url;
            } catch (e) {
                showToast('CSV indirme başarısız oldu.', 'error');
            }
        }

        function openNewContactModal() {
            document.getElementById('newContactModal').classList.remove('hidden');
            document.getElementById('newContactModal').classList.add('flex');
            document.getElementById('newFirstName').focus();
        }

        function closeNewContactModal() {
            document.getElementById('newContactModal').classList.add('hidden');
            document.getElementById('newContactModal').classList.remove('flex');
            document.getElementById('newContactForm').reset();
        }

        document.getElementById('newContactForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const payload = {
                first_name: document.getElementById('newFirstName').value.trim(),
                last_name: document.getElementById('newLastName').value.trim(),
                email: document.getElementById('newEmail').value.trim(),
                phone: document.getElementById('newPhone').value.trim(),
                company_id: document.getElementById('newCompanyId').value ? parseInt(document.getElementById('newCompanyId').value) : null,
                role: document.getElementById('newRole').value,
                job_title: document.getElementById('newJobTitle').value.trim()
            };

            try {
                const res = await fetch('/api/v1/contacts', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (res.ok) {
                    showToast('Yeni kişi başarıyla eklendi.', 'success');
                    closeNewContactModal();
                    loadContacts();
                } else {
                    const data = await res.json();
                    showToast(data.error || 'Hata oluştu.', 'error');
                }
            } catch (e) {
                showToast('Bağlantı hatası.', 'error');
            }
        });

        function showToast(msg, type = 'success') {
            const toast = document.createElement('div');
            toast.className = `fixed top-4 right-4 ${type === 'success' ? 'bg-emerald-500' : type === 'error' ? 'bg-red-500' : 'bg-blue-500'} text-white px-6 py-3 rounded-xl shadow-lg z-[100]`;
            toast.innerHTML = `<i class="fas ${type === 'success' ? 'fa-check-circle' : type === 'error' ? 'fa-exclamation-circle' : 'fa-info-circle'} mr-2"></i>${msg}`;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }

        let searchTimeout;
        document.getElementById('searchInput').addEventListener('input', () => {
            clearTimeout(searchTimeout);
            searchTimeout = setTimeout(loadContacts, 500);
        });

        document.getElementById('roleFilter').addEventListener('change', loadContacts);

        window.onclick = (e) => {
            if (e.target.id === 'newContactModal') closeNewContactModal();
        }

        loadCompanies();
        loadContacts();
    </script>
</body>
</html>

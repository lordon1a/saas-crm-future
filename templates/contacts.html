<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhatsApp CRM - Kişiler</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['"Inter"', 'sans-serif'] },
                    colors: { brand: { 50: '#f5f3ff', 100: '#ede9fe', 500: '#8b5cf6', 600: '#7c3aed', 900: '#4c1d95' } }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-50 text-slate-800 h-screen overflow-hidden flex font-sans antialiased">
    <!-- Sidebar -->
    <aside class="w-16 bg-white border-r border-slate-200 flex flex-col items-center py-6 z-30 relative shadow-sm flex-shrink-0">
        <a href="/" class="w-10 h-10 bg-brand-600 rounded-xl flex items-center justify-center text-white text-xl shadow-lg mb-8 hover:scale-105 transition-transform" title="Ana Sayfa">
            <span class="text-2xl">🐧</span>
        </a>
        <nav class="flex-1 flex flex-col gap-4 w-full px-3">
            <a href="/" class="w-10 h-10 flex items-center justify-center text-slate-400 hover:text-brand-600 hover:bg-brand-50 rounded-xl transition-all" title="Gelen Kutusu"><i class="fas fa-inbox text-lg"></i></a>
            <a href="/analytics" class="w-10 h-10 flex items-center justify-center text-slate-400 hover:text-brand-600 hover:bg-brand-50 rounded-xl transition-all" title="Raporlar"><i class="fas fa-chart-line text-lg"></i></a>
            <a href="/contacts" class="w-10 h-10 flex items-center justify-center text-brand-600 bg-brand-50 rounded-xl shadow-sm transition-all" title="Kişiler"><i class="fas fa-address-book text-lg"></i></a>
            <a href="/companies" class="w-10 h-10 flex items-center justify-center text-slate-400 hover:text-brand-600 hover:bg-brand-50 rounded-xl transition-all" title="Şirketler"><i class="fas fa-building text-lg"></i></a>
            <a href="/broadcast" class="w-10 h-10 flex items-center justify-center text-slate-400 hover:text-brand-600 hover:bg-brand-50 rounded-xl transition-all" title="Toplu Mesaj"><i class="fas fa-bullhorn text-lg"></i></a>
            <a href="/automation" class="w-10 h-10 flex items-center justify-center text-slate-400 hover:text-brand-600 hover:bg-brand-50 rounded-xl transition-all" title="Otomasyon"><i class="fas fa-robot text-lg"></i></a>
            <a href="/pipeline" class="w-10 h-10 flex items-center justify-center text-slate-400 hover:text-brand-600 hover:bg-brand-50 rounded-xl transition-all" title="Pipeline"><i class="fas fa-chart-line text-lg"></i></a>
            <a href="/tasks" class="w-10 h-10 flex items-center justify-center text-slate-400 hover:text-brand-600 hover:bg-brand-50 rounded-xl transition-all" title="Görevler"><i class="fas fa-list-check text-lg"></i></a>
            <a href="/documents" class="w-10 h-10 flex items-center justify-center text-slate-400 hover:text-brand-600 hover:bg-brand-50 rounded-xl transition-all" title="Dökümanlar"><i class="fas fa-file-lines text-lg"></i></a>
            <a href="/channels" class="w-10 h-10 flex items-center justify-center text-slate-400 hover:text-brand-600 hover:bg-brand-50 rounded-xl transition-all" title="Kanallar"><i class="fas fa-plug text-lg"></i></a>
            <a href="/settings" class="w-10 h-10 flex items-center justify-center text-slate-400 hover:text-brand-600 hover:bg-brand-50 rounded-xl transition-all" title="Ayarlar"><i class="fas fa-cog text-lg"></i></a>
        </nav>
        <div class="flex flex-col gap-4 w-full px-3 pb-4">
            <a href="/logout" class="w-10 h-10 flex items-center justify-center text-slate-400 hover:text-red-500 hover:bg-red-50 rounded-xl transition-all" title="Çıkış Yap"><i class="fas fa-sign-out-alt text-lg"></i></a>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 flex flex-col overflow-hidden">
        <!-- Top Bar -->
        <header class="bg-white border-b border-gray-200 px-8 py-4 flex-shrink-0">
            <div class="flex items-center justify-between mb-3">
                <div class="flex items-center gap-3">
                    <div class="flex items-center gap-2 text-sm text-gray-500">
                        <span>Kişiler</span>
                        <i class="fas fa-chevron-right text-xs"></i>
                        <span class="font-semibold text-gray-800">İnsanlar</span>
                    </div>
                    <button class="text-gray-400 hover:text-gray-600 p-1">
                        <i class="fas fa-info-circle text-sm"></i>
                    </button>
                </div>
                <div class="flex items-center gap-2">
                    <button onclick="exportContacts()" class="px-3 py-1.5 bg-white border border-gray-300 rounded-lg text-xs font-semibold text-gray-700 hover:bg-gray-50 transition-all flex items-center gap-2">
                        <i class="fas fa-download text-xs"></i> CSV İndir
                    </button>
                    <button class="px-3 py-1.5 bg-white border border-gray-300 rounded-lg text-xs font-semibold text-gray-700 hover:bg-gray-50 transition-all flex items-center gap-2">
                        <i class="fas fa-filter text-xs"></i> Filtrele
                    </button>
                    <button class="px-3 py-1.5 bg-white border border-gray-300 rounded-lg text-xs font-semibold text-gray-700 hover:bg-gray-50 transition-all flex items-center gap-2">
                        <i class="fas fa-cog text-xs"></i> Görünüm
                    </button>
                </div>
            </div>
            <div class="flex items-center justify-between">
                <div class="flex items-center gap-3">
                    <button onclick="openNewContactModal()" class="px-4 py-2 bg-emerald-600 text-white rounded-lg text-sm font-bold hover:bg-emerald-700 transition-all shadow-sm flex items-center gap-2">
                        <i class="fas fa-plus"></i> Kişi Ekle
                        <i class="fas fa-chevron-down text-xs ml-1"></i>
                    </button>
                    <span class="text-sm text-gray-500"><span id="contactCount" class="font-semibold text-gray-800">0</span> kişi</span>
                </div>
                <div class="relative flex-1 max-w-md ml-8">
                    <i class="fas fa-search absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 text-sm"></i>
                    <input type="text" id="searchInput" placeholder="İsim, email veya telefon ile ara..." 
                        class="w-full pl-9 pr-4 py-2 bg-white border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-brand-500/20 focus:border-brand-500 transition-all">
                </div>
            </div>
        </header>

        <!-- Filters Bar -->
        <div class="bg-gray-50 border-b border-gray-200 px-8 py-2 flex items-center gap-3 flex-shrink-0">
            <select id="roleFilter" class="bg-white border border-gray-300 rounded-lg px-3 py-1.5 text-xs font-medium text-gray-700 outline-none focus:border-brand-500 transition-all">
                <option value="">Tüm Roller</option>
                <option value="Decision Maker">Decision Maker</option>
                <option value="Champion">Champion</option>
                <option value="Influencer">Influencer</option>
                <option value="Blocker">Blocker</option>
                <option value="User">User</option>
            </select>
            <button class="px-3 py-1.5 bg-white border border-gray-300 rounded-lg text-xs font-medium text-gray-700 hover:bg-gray-50 transition-all">
                + Filtre Ekle
            </button>
        </div>

        <!-- Contacts Table -->
        <div class="flex-1 overflow-auto">
            <div class="min-w-full inline-block align-middle">
                <div class="overflow-x-auto">
                    <table class="min-w-full divide-y divide-gray-200">
                        <thead class="bg-gray-50 sticky top-0 z-10">
                            <tr>
                                <th scope="col" class="w-12 px-4 py-3">
                                    <input type="checkbox" id="selectAll" class="w-4 h-4 text-brand-600 border-gray-300 rounded focus:ring-brand-500">
                                </th>
                                <th scope="col" class="px-4 py-3 text-left text-xs font-bold text-gray-500 uppercase tracking-wider whitespace-nowrap">
                                    Ad Soyad
                                </th>
                                <th scope="col" class="px-4 py-3 text-left text-xs font-bold text-gray-500 uppercase tracking-wider whitespace-nowrap">
                                    Kuruluş
                                </th>
                                <th scope="col" class="px-4 py-3 text-left text-xs font-bold text-gray-500 uppercase tracking-wider whitespace-nowrap">
                                    E-posta
                                </th>
                                <th scope="col" class="px-4 py-3 text-left text-xs font-bold text-gray-500 uppercase tracking-wider whitespace-nowrap">
                                    Telefon
                                </th>
                                <th scope="col" class="px-4 py-3 text-left text-xs font-bold text-gray-500 uppercase tracking-wider whitespace-nowrap">
                                    Rol
                                </th>
                                <th scope="col" class="px-4 py-3 text-left text-xs font-bold text-gray-500 uppercase tracking-wider whitespace-nowrap">
                                    Lead Score
                                </th>
                                <th scope="col" class="px-4 py-3 text-left text-xs font-bold text-gray-500 uppercase tracking-wider whitespace-nowrap">
                                    Açık Anlaşmalar
                                </th>
                                <th scope="col" class="w-12 px-4 py-3"></th>
                            </tr>
                        </thead>
                        <tbody id="contactsTableBody" class="bg-white divide-y divide-gray-100">
                            <!-- JS ile doldurulacak -->
                        </tbody>
                    </table>
                </div>
            </div>
            
            <!-- Empty State -->
            <div id="emptyState" class="hidden flex flex-col items-center justify-center py-16 px-4">
                <div class="w-20 h-20 bg-gray-100 rounded-2xl flex items-center justify-center mb-6">
                    <i class="fas fa-users text-gray-400 text-3xl"></i>
                </div>
                <h3 class="text-lg font-bold text-gray-800 mb-2">Henüz kişi eklenmemiş</h3>
                <p class="text-sm text-gray-500 mb-6 text-center max-w-sm">İlk kişinizi ekleyerek müşteri ilişkilerinizi yönetmeye başlayın.</p>
                <button onclick="openNewContactModal()" class="px-6 py-3 bg-emerald-600 text-white rounded-xl text-sm font-bold hover:bg-emerald-700 transition-all shadow-md flex items-center gap-2">
                    <i class="fas fa-plus"></i> İlk Kişiyi Ekle
                </button>
            </div>
            
            <div id="loadingState" class="hidden p-12 text-center">
                <i class="fas fa-spinner fa-spin text-2xl text-brand-600 mb-2"></i>
                <p class="text-slate-500 text-sm">Yükleniyor...</p>
            </div>
        </div>
    </main>

    <!-- Contact Detail Modal -->
    <div id="contactDetailModal" class="hidden fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 items-center justify-center p-4">
        <div class="bg-white rounded-3xl shadow-2xl w-full max-w-2xl max-h-[90vh] overflow-hidden flex flex-col">
            <div class="px-8 py-6 border-b border-slate-100 flex items-center justify-between">
                <div>
                    <h3 class="text-lg font-bold text-slate-800" id="contactDetailName">Kişi Detayı</h3>
                    <p class="text-sm text-slate-500 mt-1" id="contactDetailCompany"></p>
                </div>
                <button onclick="closeContactDetailModal()" class="w-10 h-10 rounded-xl bg-slate-50 text-slate-400 hover:text-slate-600 hover:bg-slate-100 transition-all flex items-center justify-center"><i class="fas fa-times"></i></button>
            </div>
            <div class="flex-1 overflow-y-auto p-8">
                <div id="contactDetailContent" class="space-y-6"></div>
            </div>
        </div>
    </div>

    <!-- New Contact Modal -->
    <div id="newContactModal" class="hidden fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 items-center justify-center p-4">
        <div class="bg-white rounded-3xl shadow-2xl w-full max-w-lg overflow-hidden">
            <div class="px-8 py-6 border-b border-slate-100 flex items-center justify-between">
                <h3 class="text-lg font-bold text-slate-800">Yeni Kişi Ekle</h3>
                <button onclick="closeNewContactModal()" class="w-10 h-10 rounded-xl bg-slate-50 text-slate-400 hover:text-slate-600 hover:bg-slate-100 transition-all flex items-center justify-center"><i class="fas fa-times"></i></button>
            </div>
            <form id="newContactForm" class="p-8 space-y-4">
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">Ad *</label>
                        <input type="text" id="newFirstName" required placeholder="Ad" class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm outline-none focus:bg-white focus:border-brand-500 focus:ring-2 focus:ring-brand-500/20 transition-all">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">Soyad</label>
                        <input type="text" id="newLastName" placeholder="Soyad" class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm outline-none focus:bg-white focus:border-brand-500 focus:ring-2 focus:ring-brand-500/20 transition-all">
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">Email</label>
                    <input type="email" id="newEmail" placeholder="ornek@mail.com" class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm outline-none focus:bg-white focus:border-brand-500 focus:ring-2 focus:ring-brand-500/20 transition-all">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">Telefon</label>
                    <input type="tel" id="newPhone" placeholder="+90 5xx xxx xxxx" class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm outline-none focus:bg-white focus:border-brand-500 focus:ring-2 focus:ring-brand-500/20 transition-all">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">Şirket</label>
                    <select id="newCompanyId" class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm outline-none focus:bg-white focus:border-brand-500 transition-all">
                        <option value="">Seçiniz</option>
                    </select>
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">Rol</label>
                        <select id="newRole" class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm outline-none focus:bg-white focus:border-brand-500 transition-all">
                            <option value="">Seçiniz</option>
                            <option value="Decision Maker">Decision Maker</option>
                            <option value="Champion">Champion</option>
                            <option value="Influencer">Influencer</option>
                            <option value="Blocker">Blocker</option>
                            <option value="User">User</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">Unvan</label>
                        <input type="text" id="newJobTitle" placeholder="İş Unvanı" class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm outline-none focus:bg-white focus:border-brand-500 focus:ring-2 focus:ring-brand-500/20 transition-all">
                    </div>
                </div>
                <div class="flex gap-3 pt-4">
                    <button type="button" onclick="closeNewContactModal()" class="flex-1 py-3 bg-slate-100 text-slate-600 font-bold rounded-xl hover:bg-slate-200 transition-all">İptal</button>
                    <button type="submit" class="flex-1 py-3 bg-brand-600 text-white font-bold rounded-xl hover:bg-brand-700 hover:shadow-lg transition-all shadow-md">Kişiyi Kaydet</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        let allContacts = [];
        let allCompanies = [];

        // Get company_id from URL if present
        const urlParams = new URLSearchParams(window.location.search);
        const companyIdFilter = urlParams.get('company_id');

        async function loadCompanies() {
            try {
                const res = await fetch('/api/v1/companies');
                const data = await res.json();
                allCompanies = data.companies;
                
                const select = document.getElementById('newCompanyId');
                allCompanies.forEach(c => {
                    const option = document.createElement('option');
                    option.value = c.id;
                    option.textContent = c.name;
                    select.appendChild(option);
                });
            } catch (e) {
                console.error(e);
            }
        }

        async function loadContacts() {
            const loading = document.getElementById('loadingState');
            loading.classList.remove('hidden');
            
            try {
                const search = document.getElementById('searchInput').value.trim();
                const role = document.getElementById('roleFilter').value;
                
                let url = '/api/v1/contacts?';
                if (search) url += `search=${encodeURIComponent(search)}&`;
                if (role) url += `role=${encodeURIComponent(role)}&`;
                if (companyIdFilter) url += `company_id=${companyIdFilter}&`;
                
                const res = await fetch(url);
                const data = await res.json();
                allContacts = data.contacts;
                
                renderContacts(allContacts);
                document.getElementById('contactCount').textContent = allContacts.length;
                
                // Update header if filtering by company
                if (companyIdFilter && allContacts.length > 0 && allContacts[0].company_name) {
                    document.querySelector('h1').innerHTML = `Kişiler <span class="text-sm font-normal text-slate-500">/ ${allContacts[0].company_name}</span>`;
                }
            } catch (e) {
                console.error(e);
                showToast('Kişiler yüklenirken bir hata oluştu.', 'error');
            } finally {
                loading.classList.add('hidden');
            }
        }

        function renderContacts(contacts) {
            const tbody = document.getElementById('contactsTableBody');
            const emptyState = document.getElementById('emptyState');
            
            if (contacts.length === 0) {
                tbody.innerHTML = '';
                emptyState.classList.remove('hidden');
                return;
            }
            
            emptyState.classList.add('hidden');
            tbody.innerHTML = '';

            contacts.forEach(c => {
                const tr = document.createElement('tr');
                tr.className = 'h-12 hover:bg-blue-50/40 transition-colors';
                
                const initials = (c.first_name.substring(0, 1) + (c.last_name ? c.last_name.substring(0, 1) : '')).toUpperCase();
                
                const roleColor = {
                    'Decision Maker': 'bg-purple-100 text-purple-800',
                    'Champion': 'bg-yellow-100 text-yellow-800',
                    'Influencer': 'bg-blue-100 text-blue-800',
                    'Blocker': 'bg-red-100 text-red-800',
                    'User': 'bg-gray-100 text-gray-800'
                }[c.role] || 'bg-gray-100 text-gray-800';
                
                // Lead score color indicator
                let scoreColor = 'bg-gray-400';
                if (c.lead_score >= 80) scoreColor = 'bg-green-500';
                else if (c.lead_score >= 50) scoreColor = 'bg-yellow-500';
                else if (c.lead_score >= 30) scoreColor = 'bg-orange-500';
                else scoreColor = 'bg-red-500';
                
                tr.innerHTML = `
                    <td class="px-4 py-3 whitespace-nowrap">
                        <input type="checkbox" class="w-4 h-4 text-brand-600 border-gray-300 rounded focus:ring-brand-500">
                    </td>
                    <td class="px-4 py-3 whitespace-nowrap">
                        <div class="flex items-center gap-3">
                            <div class="w-8 h-8 rounded-full bg-gradient-to-br from-brand-500 to-violet-600 text-white flex items-center justify-center font-bold text-xs flex-shrink-0">
                                ${initials}
                            </div>
                            <span class="text-sm font-semibold text-blue-600 hover:underline cursor-pointer" onclick="viewContact(${c.id})">${c.full_name}</span>
                        </div>
                    </td>
                    <td class="px-4 py-3 whitespace-nowrap editable-cell cursor-pointer hover:bg-blue-50/60 transition-colors" 
                        data-id="${c.id}" 
                        data-field="company_name" 
                        data-value="${c.company_name || ''}"
                        onclick="enableInlineEdit(this)">
                        <span class="text-sm text-gray-500">${c.company_name || '-'}</span>
                    </td>
                    <td class="px-4 py-3 whitespace-nowrap editable-cell cursor-pointer hover:bg-blue-50/60 transition-colors" 
                        data-id="${c.id}" 
                        data-field="email" 
                        data-value="${c.email || ''}"
                        data-type="email"
                        onclick="enableInlineEdit(this)">
                        <div class="flex items-center gap-2">
                            <span class="text-sm text-gray-500">${c.email || '-'}</span>
                            ${c.email ? '<span class="px-1.5 py-0.5 bg-gray-100 text-gray-600 rounded text-[10px] font-bold">İş</span>' : ''}
                        </div>
                    </td>
                    <td class="px-4 py-3 whitespace-nowrap editable-cell cursor-pointer hover:bg-blue-50/60 transition-colors" 
                        data-id="${c.id}" 
                        data-field="phone" 
                        data-value="${c.phone || ''}"
                        data-type="tel"
                        onclick="enableInlineEdit(this)">
                        <span class="text-sm text-gray-500">${c.phone || '-'}</span>
                    </td>
                    <td class="px-4 py-3 whitespace-nowrap editable-cell cursor-pointer hover:bg-blue-50/60 transition-colors" 
                        data-id="${c.id}" 
                        data-field="role" 
                        data-value="${c.role || ''}"
                        data-type="select"
                        data-options='["Decision Maker","Champion","Influencer","Blocker","User"]'
                        onclick="enableInlineEdit(this)">
                        <span class="px-2 py-1 rounded-md text-xs font-semibold ${roleColor}">${c.role || '-'}</span>
                    </td>
                    <td class="px-4 py-3 whitespace-nowrap editable-cell cursor-pointer hover:bg-blue-50/60 transition-colors" 
                        data-id="${c.id}" 
                        data-field="lead_score" 
                        data-value="${c.lead_score}"
                        data-type="number"
                        onclick="enableInlineEdit(this)">
                        <div class="flex items-center gap-2">
                            <span class="w-2 h-2 rounded-full ${scoreColor}"></span>
                            <span class="text-sm font-semibold text-gray-700">${c.lead_score}</span>
                        </div>
                    </td>
                    <td class="px-4 py-3 whitespace-nowrap">
                        <span class="px-2 py-1 bg-green-100 text-green-800 rounded-md text-xs font-semibold">0 açık</span>
                    </td>
                    <td class="px-4 py-3 whitespace-nowrap text-right">
                        <button class="text-gray-400 hover:text-gray-600 p-1" onclick="showContactMenu(event, ${c.id})">
                            <i class="fas fa-ellipsis-v"></i>
                        </button>
                    </td>
                `;
                
                tbody.appendChild(tr);
            });
        }
        
        // Inline Editing System
        let currentEditingCell = null;
        
        function enableInlineEdit(cell) {
            // Prevent multiple edits
            if (currentEditingCell) {
                cancelInlineEdit();
            }
            
            currentEditingCell = cell;
            const contactId = cell.dataset.id;
            const field = cell.dataset.field;
            const currentValue = cell.dataset.value;
            const fieldType = cell.dataset.type || 'text';
            
            // Store original content
            cell.dataset.originalHtml = cell.innerHTML;
            
            // Create input based on type
            let inputHtml = '';
            
            if (fieldType === 'select') {
                const options = JSON.parse(cell.dataset.options || '[]');
                inputHtml = `
                    <select class="inline-edit-input w-full px-2 py-1 text-sm border-2 border-blue-500 rounded focus:outline-none focus:ring-2 focus:ring-blue-500/20 bg-white">
                        <option value="">Seçiniz</option>
                        ${options.map(opt => `<option value="${opt}" ${currentValue === opt ? 'selected' : ''}>${opt}</option>`).join('')}
                    </select>
                `;
            } else if (fieldType === 'number') {
                inputHtml = `
                    <input type="number" 
                        class="inline-edit-input w-full px-2 py-1 text-sm border-2 border-blue-500 rounded focus:outline-none focus:ring-2 focus:ring-blue-500/20" 
                        value="${currentValue}"
                        min="0"
                        max="100">
                `;
            } else {
                inputHtml = `
                    <input type="${fieldType}" 
                        class="inline-edit-input w-full px-2 py-1 text-sm border-2 border-blue-500 rounded focus:outline-none focus:ring-2 focus:ring-blue-500/20" 
                        value="${currentValue}"
                        placeholder="${field === 'email' ? 'ornek@mail.com' : field === 'phone' ? '+90 5xx xxx xxxx' : 'Değer girin'}">
                `;
            }
            
            cell.innerHTML = inputHtml;
            cell.classList.add('editing');
            
            const input = cell.querySelector('.inline-edit-input');
            input.focus();
            if (input.type !== 'number') input.select();
            
            // Event listeners
            input.addEventListener('blur', () => saveInlineEdit(cell, contactId, field));
            input.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    saveInlineEdit(cell, contactId, field);
                } else if (e.key === 'Escape') {
                    e.preventDefault();
                    cancelInlineEdit();
                }
            });
        }
        
        async function saveInlineEdit(cell, contactId, field) {
            const input = cell.querySelector('.inline-edit-input');
            const newValue = input.value.trim();
            const oldValue = cell.dataset.value;
            
            // No change
            if (newValue === oldValue) {
                cancelInlineEdit();
                return;
            }
            
            // Show saving state
            cell.innerHTML = `
                <div class="flex items-center gap-2">
                    <span class="text-sm text-gray-500">${newValue || '-'}</span>
                    <span class="text-[10px] text-gray-400 animate-pulse">Kaydediliyor...</span>
                </div>
            `;
            
            try {
                // API call to update contact
                const response = await fetch(`/api/v1/contacts/${contactId}`, {
                    method: 'PATCH',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ [field]: newValue })
                });
                
                if (!response.ok) {
                    throw new Error('Kayıt başarısız');
                }
                
                // Update local data
                cell.dataset.value = newValue;
                const contact = allContacts.find(c => c.id == contactId);
                if (contact) {
                    contact[field] = newValue;
                }
                
                // Show success state briefly
                cell.innerHTML = `
                    <div class="flex items-center gap-2">
                        <span class="text-sm text-gray-500">${newValue || '-'}</span>
                        <span class="text-[10px] text-green-600 font-semibold">✓ Kaydedildi</span>
                    </div>
                `;
                
                // Restore normal view after 1 second
                setTimeout(() => {
                    if (cell === currentEditingCell) {
                        restoreCellView(cell, field, newValue);
                        currentEditingCell = null;
                    }
                }, 1000);
                
            } catch (error) {
                console.error('Save error:', error);
                
                // Show error state
                cell.innerHTML = `
                    <div class="flex items-center gap-2">
                        <span class="text-sm text-red-600">${newValue}</span>
                        <span class="text-[10px] text-red-600 font-semibold">✗ Hata</span>
                    </div>
                `;
                cell.classList.add('ring-2', 'ring-red-500');
                
                // Restore original after 2 seconds
                setTimeout(() => {
                    cell.classList.remove('ring-2', 'ring-red-500');
                    restoreCellView(cell, field, oldValue);
                    currentEditingCell = null;
                }, 2000);
            }
        }
        
        function cancelInlineEdit() {
            if (!currentEditingCell) return;
            
            const originalHtml = currentEditingCell.dataset.originalHtml;
            currentEditingCell.innerHTML = originalHtml;
            currentEditingCell.classList.remove('editing');
            currentEditingCell = null;
        }
        
        function restoreCellView(cell, field, value) {
            cell.classList.remove('editing');
            
            // Restore based on field type
            if (field === 'role') {
                const roleColor = {
                    'Decision Maker': 'bg-purple-100 text-purple-800',
                    'Champion': 'bg-yellow-100 text-yellow-800',
                    'Influencer': 'bg-blue-100 text-blue-800',
                    'Blocker': 'bg-red-100 text-red-800',
                    'User': 'bg-gray-100 text-gray-800'
                }[value] || 'bg-gray-100 text-gray-800';
                cell.innerHTML = `<span class="px-2 py-1 rounded-md text-xs font-semibold ${roleColor}">${value || '-'}</span>`;
            } else if (field === 'lead_score') {
                let scoreColor = 'bg-gray-400';
                const score = parseInt(value);
                if (score >= 80) scoreColor = 'bg-green-500';
                else if (score >= 50) scoreColor = 'bg-yellow-500';
                else if (score >= 30) scoreColor = 'bg-orange-500';
                else scoreColor = 'bg-red-500';
                cell.innerHTML = `
                    <div class="flex items-center gap-2">
                        <span class="w-2 h-2 rounded-full ${scoreColor}"></span>
                        <span class="text-sm font-semibold text-gray-700">${value}</span>
                    </div>
                `;
            } else if (field === 'email') {
                cell.innerHTML = `
                    <div class="flex items-center gap-2">
                        <span class="text-sm text-gray-500">${value || '-'}</span>
                        ${value ? '<span class="px-1.5 py-0.5 bg-gray-100 text-gray-600 rounded text-[10px] font-bold">İş</span>' : ''}
                    </div>
                `;
            } else {
                cell.innerHTML = `<span class="text-sm text-gray-500">${value || '-'}</span>`;
            }
        }
        
        function showContactMenu(event, contactId) {
            event.stopPropagation();
            // TODO: Implement context menu
            console.log('Show menu for contact:', contactId);
        }

        let currentContact = null;
        let contactCustomFields = [];

        async function viewContact(id) {
            const contact = allContacts.find(c => c.id === id);
            if (!contact) return;
            
            currentContact = contact;
            
            // Show modal
            const modal = document.getElementById('contactDetailModal');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
            
            // Set header
            document.getElementById('contactDetailName').textContent = contact.full_name;
            document.getElementById('contactDetailCompany').textContent = contact.company_name || 'Şirket belirtilmemiş';
            
            // Load custom fields and render
            await loadContactCustomFields(id);
        }

        function closeContactDetailModal() {
            document.getElementById('contactDetailModal').classList.add('hidden');
            document.getElementById('contactDetailModal').classList.remove('flex');
            currentContact = null;
        }

        async function loadContactCustomFields(contactId) {
            try {
                // Load custom field definitions
                const fieldsRes = await fetch('/api/v1/custom-fields?entity_type=contact');
                const fields = await fieldsRes.json();
                
                // Load custom field values
                const valuesRes = await fetch(`/api/v1/custom-fields/values/contact/${contactId}`);
                const values = await valuesRes.json();
                
                contactCustomFields = fields;
                renderContactDetail(values);
            } catch (e) {
                console.error(e);
                renderContactDetail({});
            }
        }

        function renderContactDetail(customFieldValues) {
            const container = document.getElementById('contactDetailContent');
            
            let html = `
                <div class="bg-slate-50 rounded-xl p-4 space-y-3">
                    <h4 class="text-xs font-bold text-slate-500 uppercase tracking-wider">Temel Bilgiler</h4>
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <p class="text-xs text-slate-400 mb-1">Email</p>
                            <p class="text-sm text-slate-700">${currentContact.email || '-'}</p>
                        </div>
                        <div>
                            <p class="text-xs text-slate-400 mb-1">Telefon</p>
                            <p class="text-sm text-slate-700">${currentContact.phone || '-'}</p>
                        </div>
                        <div>
                            <p class="text-xs text-slate-400 mb-1">Rol</p>
                            <p class="text-sm text-slate-700">${currentContact.role || '-'}</p>
                        </div>
                        <div>
                            <p class="text-xs text-slate-400 mb-1">Unvan</p>
                            <p class="text-sm text-slate-700">${currentContact.job_title || '-'}</p>
                        </div>
                        <div>
                            <p class="text-xs text-slate-400 mb-1">Lead Score</p>
                            <p class="text-sm font-bold text-emerald-600">${currentContact.lead_score}</p>
                        </div>
                    </div>
                </div>
            `;
            
            // Custom fields section
            if (contactCustomFields.length > 0) {
                html += `
                    <div class="bg-slate-50 rounded-xl p-4 space-y-3">
                        <h4 class="text-xs font-bold text-slate-500 uppercase tracking-wider">Özel Alanlar</h4>
                        <div class="space-y-3">
                `;
                
                contactCustomFields.forEach(field => {
                    const value = customFieldValues[field.field_name];
                    html += renderCustomFieldInput(field, value);
                });
                
                html += `
                        </div>
                        <button onclick="saveContactCustomFields()" class="w-full mt-4 py-2.5 bg-brand-600 text-white font-bold rounded-xl hover:bg-brand-700 transition-colors">
                            <i class="fas fa-save mr-2"></i>Özel Alanları Kaydet
                        </button>
                    </div>
                `;
            }
            
            container.innerHTML = html;
        }

        function renderCustomFieldInput(field, value) {
            const fieldId = `custom_field_${field.id}`;
            let input = '';
            
            if (field.field_type === 'text') {
                input = `<input type="text" id="${fieldId}" value="${value || ''}" class="w-full px-4 py-2.5 bg-white border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-brand-500" ${field.is_required ? 'required' : ''}>`;
            } else if (field.field_type === 'number') {
                input = `<input type="number" id="${fieldId}" value="${value || ''}" class="w-full px-4 py-2.5 bg-white border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-brand-500" ${field.is_required ? 'required' : ''}>`;
            } else if (field.field_type === 'date') {
                input = `<input type="date" id="${fieldId}" value="${value || ''}" class="w-full px-4 py-2.5 bg-white border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-brand-500" ${field.is_required ? 'required' : ''}>`;
            } else if (field.field_type === 'checkbox') {
                const checked = value === true || value === 'true' ? 'checked' : '';
                input = `<label class="flex items-center gap-2 cursor-pointer">
                    <input type="checkbox" id="${fieldId}" ${checked} class="w-4 h-4 text-brand-600 border-slate-300 rounded focus:ring-brand-500">
                    <span class="text-sm text-slate-600">Evet</span>
                </label>`;
            } else if (field.field_type === 'dropdown') {
                const options = field.options ? JSON.parse(field.options) : [];
                input = `<select id="${fieldId}" class="w-full px-4 py-2.5 bg-white border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-brand-500" ${field.is_required ? 'required' : ''}>
                    <option value="">Seçiniz</option>
                    ${options.map(opt => `<option value="${opt}" ${value === opt ? 'selected' : ''}>${opt}</option>`).join('')}
                </select>`;
            } else if (field.field_type === 'multi_select') {
                const options = field.options ? JSON.parse(field.options) : [];
                const selectedValues = Array.isArray(value) ? value : [];
                input = `<div class="space-y-2">
                    ${options.map(opt => {
                        const checked = selectedValues.includes(opt) ? 'checked' : '';
                        return `<label class="flex items-center gap-2 cursor-pointer">
                            <input type="checkbox" name="${fieldId}" value="${opt}" ${checked} class="w-4 h-4 text-brand-600 border-slate-300 rounded focus:ring-brand-500">
                            <span class="text-sm text-slate-600">${opt}</span>
                        </label>`;
                    }).join('')}
                </div>`;
            }
            
            return `
                <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">
                        ${field.field_name}${field.is_required ? ' *' : ''}
                    </label>
                    ${input}
                </div>
            `;
        }

        async function saveContactCustomFields() {
            if (!currentContact) return;
            
            try {
                const promises = [];
                
                for (const field of contactCustomFields) {
                    const fieldId = `custom_field_${field.id}`;
                    let value;
                    
                    if (field.field_type === 'checkbox') {
                        value = document.getElementById(fieldId)?.checked || false;
                    } else if (field.field_type === 'multi_select') {
                        const checkboxes = document.querySelectorAll(`input[name="${fieldId}"]:checked`);
                        value = Array.from(checkboxes).map(cb => cb.value);
                    } else {
                        value = document.getElementById(fieldId)?.value || '';
                    }
                    
                    promises.push(
                        fetch('/api/v1/custom-fields/values', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                custom_field_id: field.id,
                                entity_id: currentContact.id,
                                value: value
                            })
                        })
                    );
                }
                
                await Promise.all(promises);
                showToast('Özel alanlar kaydedildi', 'success');
            } catch (e) {
                console.error(e);
                showToast('Kaydetme başarısız', 'error');
            }
        }

        async function exportContacts() {
            try {
                const search = document.getElementById('searchInput').value.trim();
                const role = document.getElementById('roleFilter').value;
                
                let url = '/api/v1/contacts/export?';
                if (search) url += `search=${encodeURIComponent(search)}&`;
                if (role) url += `role=${encodeURIComponent(role)}&`;
                
                window.location.href = url;
            } catch (e) {
                showToast('CSV indirme başarısız oldu.', 'error');
            }
        }

        function openNewContactModal() {
            document.getElementById('newContactModal').classList.remove('hidden');
            document.getElementById('newContactModal').classList.add('flex');
            document.getElementById('newFirstName').focus();
        }

        function closeNewContactModal() {
            document.getElementById('newContactModal').classList.add('hidden');
            document.getElementById('newContactModal').classList.remove('flex');
            document.getElementById('newContactForm').reset();
        }

        document.getElementById('newContactForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const payload = {
                first_name: document.getElementById('newFirstName').value.trim(),
                last_name: document.getElementById('newLastName').value.trim(),
                email: document.getElementById('newEmail').value.trim(),
                phone: document.getElementById('newPhone').value.trim(),
                company_id: document.getElementById('newCompanyId').value ? parseInt(document.getElementById('newCompanyId').value) : null,
                role: document.getElementById('newRole').value,
                job_title: document.getElementById('newJobTitle').value.trim()
            };

            try {
                const res = await fetch('/api/v1/contacts', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (res.ok) {
                    showToast('Yeni kişi başarıyla eklendi.', 'success');
                    closeNewContactModal();
                    loadContacts();
                } else {
                    const data = await res.json();
                    showToast(data.error || 'Hata oluştu.', 'error');
                }
            } catch (e) {
                showToast('Bağlantı hatası.', 'error');
            }
        });

        function showToast(msg, type = 'success') {
            const toast = document.createElement('div');
            toast.className = `fixed top-4 right-4 ${type === 'success' ? 'bg-emerald-500' : type === 'error' ? 'bg-red-500' : 'bg-blue-500'} text-white px-6 py-3 rounded-xl shadow-lg z-[100]`;
            toast.innerHTML = `<i class="fas ${type === 'success' ? 'fa-check-circle' : type === 'error' ? 'fa-exclamation-circle' : 'fa-info-circle'} mr-2"></i>${msg}`;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }

        let searchTimeout;
        document.getElementById('searchInput').addEventListener('input', () => {
            clearTimeout(searchTimeout);
            searchTimeout = setTimeout(loadContacts, 500);
        });

        document.getElementById('roleFilter').addEventListener('change', loadContacts);

        window.onclick = (e) => {
            if (e.target.id === 'newContactModal') closeNewContactModal();
            if (e.target.id === 'contactDetailModal') closeContactDetailModal();
        }

        loadCompanies();
        loadContacts();
    </script>
</body>

	            <main class="flex-1 flex flex-col overflow-hidden">
<header class="bg-white border-b border-gray-200 px-4 md:px-8 py-3 flex-shrink-0">

                    <input type="text" data-topbar-search placeholder="Pipedrive'da ara" class="w-full pl-10 pr-4 py-2.5 bg-white border border-gray-300 rounded-full text-sm focus:outline-none focus:ring-2 focus:ring-brand-500/20 focus:border-brand-500 transition-all">
                </div>

                            <span data-topbar-name class="hidden md:block text-xs font-semibold text-gray-700 max-w-[80px] truncate">Yigit</span>
                            <i class="fas fa-chevron-down text-[10px] text-gray-500"></i>
                        </button>
                        <div data-topbar-menu class="hidden absolute right-0 top-12 w-72 bg-white border border-gray-200 rounded-xl shadow-xl py-2 z-50">

		<header class="h-16 bg-white border-b border-slate-200 px-8 flex items-center justify-between">
			<div class="flex items-center gap-4">
				<h1 class="text-xl font-bold text-slate-800">Dokuman Kutuphanesi</h1>
				<span class="text-sm text-slate-500"><span id="docCount">0</span> kayit</span>
			</div>
			<div class="flex items-center gap-2">
				<button id="refreshBtn" class="px-4 py-2 bg-white border border-slate-200 rounded-xl text-sm font-semibold text-slate-600 hover:bg-slate-50 transition-colors">
					<i class="fas fa-sync-alt mr-2"></i>Yenile
				</button>
			</div>
		</header>

		<section class="bg-white border-b border-slate-200 p-6">
			<h2 class="text-sm font-bold text-slate-700 uppercase tracking-wider mb-4">Dokuman Yukle</h2>
			<form id="uploadForm" class="grid grid-cols-1 md:grid-cols-6 gap-3 items-end">
				<div class="md:col-span-2">
					<label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1">Dosya</label>
					<input id="fileInput" type="file" required class="w-full text-sm bg-slate-50 border border-slate-200 rounded-xl px-3 py-2">
				</div>
				<div>
					<label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1">Baslik</label>
					<input id="nameInput" type="text" placeholder="Opsiyonel" class="w-full text-sm bg-slate-50 border border-slate-200 rounded-xl px-3 py-2">
				</div>
				<div>
					<label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1">Kategori</label>
					<select id="categoryInput" class="w-full text-sm bg-slate-50 border border-slate-200 rounded-xl px-3 py-2">
						<option value="general">general</option>
						<option value="proposal">proposal</option>
						<option value="contract">contract</option>
						<option value="invoice">invoice</option>
					</select>
				</div>
				<div>
					<label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1">Musteri gorur</label>
					<label class="flex items-center gap-2 h-10 px-3 border border-slate-200 bg-slate-50 rounded-xl text-sm">
						<input id="visibleInput" type="checkbox" class="accent-brand-600">
						Evet
					</label>
				</div>
				<div>
					<button type="submit" class="w-full px-4 py-2 bg-brand-600 text-white rounded-xl text-sm font-bold hover:bg-brand-700 transition-colors">Yukle</button>
				</div>
			</form>
		</section>

		<section class="bg-white border-b border-slate-200 p-6">
			<div class="grid grid-cols-1 md:grid-cols-4 gap-3 items-end">
				<div>
					<label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1">Kategori Filtresi</label>
					<select id="categoryFilter" class="w-full text-sm bg-slate-50 border border-slate-200 rounded-xl px-3 py-2">
						<option value="">Tum kategoriler</option>
						<option value="general">general</option>
						<option value="proposal">proposal</option>
						<option value="contract">contract</option>
						<option value="invoice">invoice</option>
					</select>
				</div>
				<div>
					<label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1">Sayfa basi</label>
					<select id="perPage" class="w-full text-sm bg-slate-50 border border-slate-200 rounded-xl px-3 py-2">
						<option value="10">10</option>
						<option value="20" selected>20</option>
						<option value="50">50</option>
					</select>
				</div>
			</div>
		</section>

		<section class="flex-1 overflow-auto p-6 grid grid-cols-1 lg:grid-cols-3 gap-6">
			<div class="lg:col-span-2 bg-white border border-slate-200 rounded-2xl overflow-hidden">
				<div class="px-5 py-4 border-b border-slate-200 flex items-center justify-between">
					<h3 class="text-sm font-bold text-slate-700 uppercase tracking-wider">Dokumanlar</h3>
					<span id="paginationInfo" class="text-xs text-slate-500"></span>
				</div>
				<div id="docList" class="divide-y divide-slate-100"></div>
			</div>

			<div class="space-y-6">
				<div class="bg-white border border-slate-200 rounded-2xl overflow-hidden">
					<div class="px-5 py-4 border-b border-slate-200">
						<h3 class="text-sm font-bold text-slate-700 uppercase tracking-wider">Versiyonlar</h3>
					</div>
					<div class="p-4 space-y-3">
						<div class="text-xs text-slate-500" id="selectedDocText">Bir dokuman secin</div>
						<form id="versionForm" class="space-y-2 hidden">
							<input id="versionFileInput" type="file" required class="w-full text-sm bg-slate-50 border border-slate-200 rounded-xl px-3 py-2">
							<button type="submit" class="w-full px-3 py-2 bg-brand-600 text-white rounded-xl text-sm font-bold hover:bg-brand-700">Yeni Versiyon Yukle</button>
						</form>
						<div id="versionList" class="space-y-2"></div>
					</div>
				</div>

				<div class="bg-white border border-slate-200 rounded-2xl overflow-hidden">
					<div class="px-5 py-4 border-b border-slate-200">
						<h3 class="text-sm font-bold text-slate-700 uppercase tracking-wider">Template Yonetimi</h3>
					</div>
					<div class="p-4 space-y-3">
						<form id="templateForm" class="space-y-2">
							<input id="templateName" type="text" placeholder="Template adi" required class="w-full text-sm bg-slate-50 border border-slate-200 rounded-xl px-3 py-2">
							<select id="templateCategory" class="w-full text-sm bg-slate-50 border border-slate-200 rounded-xl px-3 py-2">
								<option value="general">general</option>
								<option value="proposal">proposal</option>
								<option value="contract">contract</option>
								<option value="invoice">invoice</option>
							</select>
							<textarea id="templateBody" rows="5" placeholder="Merhaba {{ company_name }}" class="w-full text-sm bg-slate-50 border border-slate-200 rounded-xl px-3 py-2"></textarea>
							<button type="submit" class="w-full px-3 py-2 bg-slate-800 text-white rounded-xl text-sm font-bold hover:bg-slate-900">Template Kaydet</button>
						</form>

						<select id="templateSelect" class="w-full text-sm bg-slate-50 border border-slate-200 rounded-xl px-3 py-2"></select>
						<button id="renderTemplateBtn" class="w-full px-3 py-2 bg-white border border-slate-200 rounded-xl text-sm font-semibold text-slate-700 hover:bg-slate-50">Template Onizle</button>
						<pre id="templatePreview" class="text-xs text-slate-700 whitespace-pre-wrap bg-slate-50 border border-slate-200 rounded-xl p-3 min-h-[90px]"></pre>
					</div>
				</div>
			</div>
		</section>
	</main>

	<script>
		const API_BASE = '/api/v1/documents';
		let currentPage = 1;
		let selectedDocumentId = null;

		async function api(path, options) {
			const res = await fetch(path, options || {});
			const isJson = (res.headers.get('content-type') || '').includes('application/json');
			const data = isJson ? await res.json() : null;
			if (!res.ok) {
				throw new Error((data && data.error) || 'Islem basarisiz');
			}
			return data;
		}

		function formatBytes(size) {
			const value = Number(size || 0);
			if (value < 1024) return value + ' B';
			if (value < 1024 * 1024) return (value / 1024).toFixed(1) + ' KB';
			return (value / (1024 * 1024)).toFixed(2) + ' MB';
		}

		async function loadDocuments() {
			const category = document.getElementById('categoryFilter').value;
			const perPage = Number(document.getElementById('perPage').value || 20);
			const query = new URLSearchParams({ page: String(currentPage), per_page: String(perPage) });
			if (category) query.set('category', category);

			const data = await api(API_BASE + '?' + query.toString());
			const payload = data.data || { items: [] };
			const rows = payload.items || [];

			document.getElementById('docCount').textContent = String(payload.total || 0);
			document.getElementById('paginationInfo').textContent = `Sayfa ${payload.page || 1} / ${payload.pages || 1}`;

			const list = document.getElementById('docList');
			if (!rows.length) {
				list.innerHTML = '<div class="p-6 text-sm text-slate-500">Kayit bulunamadi.</div>';
				return;
			}

			list.innerHTML = rows.map(row => `
				<div class="p-4 flex items-center justify-between gap-3">
					<div class="min-w-0">
						<p class="text-sm font-bold text-slate-800 truncate">${row.name}</p>
						<p class="text-xs text-slate-500">${row.category || 'general'} | v${row.current_version || '-'} | ${formatBytes(row.file_size)}</p>
					</div>
					<div class="flex items-center gap-2">
						<button class="px-2.5 py-1.5 text-xs font-semibold border border-slate-200 rounded-lg hover:bg-slate-50" onclick='selectDocument(${row.id}, ${JSON.stringify(String(row.name || ""))})'>Versiyonlar</button>
						<button class="px-2.5 py-1.5 text-xs font-semibold border border-slate-200 rounded-lg hover:bg-slate-50" onclick="downloadDocument(${row.id})">Indir</button>
					</div>
				</div>
			`).join('');
		}

		async function uploadDocument(event) {
			event.preventDefault();
			const file = document.getElementById('fileInput').files[0];
			if (!file) return;

			const fd = new FormData();
			fd.append('file', file);
			fd.append('name', document.getElementById('nameInput').value.trim());
			fd.append('category', document.getElementById('categoryInput').value);
			fd.append('is_customer_visible', document.getElementById('visibleInput').checked ? 'true' : 'false');

			await api(API_BASE, { method: 'POST', body: fd });
			document.getElementById('uploadForm').reset();
			currentPage = 1;
			await loadDocuments();
		}

		function downloadDocument(documentId, versionId) {
			const query = versionId ? ('?version_id=' + encodeURIComponent(versionId)) : '';
			window.open(`${API_BASE}/${documentId}/download${query}`, '_blank');
		}

		async function selectDocument(documentId, documentName) {
			selectedDocumentId = documentId;
			document.getElementById('selectedDocText').textContent = documentName;
			document.getElementById('versionForm').classList.remove('hidden');
			await loadVersions();
		}

		async function loadVersions() {
			if (!selectedDocumentId) return;
			const data = await api(`${API_BASE}/${selectedDocumentId}/versions`);
			const rows = data.data || [];
			const list = document.getElementById('versionList');
			if (!rows.length) {
				list.innerHTML = '<p class="text-xs text-slate-500">Versiyon bulunamadi.</p>';
				return;
			}

			list.innerHTML = rows.map(row => `
				<div class="border border-slate-200 rounded-xl p-3 bg-slate-50 flex items-center justify-between gap-2">
					<div>
						<p class="text-xs font-bold text-slate-700">v${row.version_number}</p>
						<p class="text-[11px] text-slate-500">${formatBytes(row.file_size)} | ${row.created_at || ''}</p>
					</div>
					<button class="px-2 py-1 text-[11px] font-semibold bg-white border border-slate-200 rounded-lg" onclick="downloadDocument(${selectedDocumentId}, ${row.id})">Indir</button>
				</div>
			`).join('');
		}

		async function uploadVersion(event) {
			event.preventDefault();
			if (!selectedDocumentId) return;
			const file = document.getElementById('versionFileInput').files[0];
			if (!file) return;

			const fd = new FormData();
			fd.append('file', file);
			await api(`${API_BASE}/${selectedDocumentId}/versions`, { method: 'POST', body: fd });
			document.getElementById('versionForm').reset();
			await loadVersions();
			await loadDocuments();
		}

		async function loadTemplates() {
			const data = await api(`${API_BASE}/templates`);
			const rows = data.data || [];
			const select = document.getElementById('templateSelect');
			if (!rows.length) {
				select.innerHTML = '<option value="">Template yok</option>';
				return;
			}
			select.innerHTML = rows.map(row => `<option value="${row.id}">${row.name} (${row.category || 'general'})</option>`).join('');
		}

		async function createTemplate(event) {
			event.preventDefault();
			await api(`${API_BASE}/templates`, {
				method: 'POST',
				headers: { 'Content-Type': 'application/json' },
				body: JSON.stringify({
					name: document.getElementById('templateName').value.trim(),
					category: document.getElementById('templateCategory').value,
					template_body: document.getElementById('templateBody').value,
					variables: ['company_name', 'contact_name', 'deal_value', 'today_date'],
				})
			});
			document.getElementById('templateForm').reset();
			await loadTemplates();
		}

		async function renderTemplatePreview() {
			const templateId = document.getElementById('templateSelect').value;
			if (!templateId) return;

			const data = await api(`${API_BASE}/templates/${templateId}/render`, {
				method: 'POST',
				headers: { 'Content-Type': 'application/json' },
				body: JSON.stringify({
					company_name: 'Acme Ltd',
					contact_name: 'Jane Doe',
					deal_value: '12500',
					today_date: new Date().toISOString().slice(0, 10),
				})
			});

			document.getElementById('templatePreview').textContent = (data.data && data.data.content) || '';
		}

		function wireEvents() {
			document.getElementById('uploadForm').addEventListener('submit', async (event) => {
				try {
					await uploadDocument(event);
				} catch (err) {
					alert(err.message);
				}
			});

			document.getElementById('versionForm').addEventListener('submit', async (event) => {
				try {
					await uploadVersion(event);
				} catch (err) {
					alert(err.message);
				}
			});

			document.getElementById('templateForm').addEventListener('submit', async (event) => {
				try {
					await createTemplate(event);
				} catch (err) {
					alert(err.message);
				}
			});

			document.getElementById('renderTemplateBtn').addEventListener('click', async () => {
				try {
					await renderTemplatePreview();
				} catch (err) {
					alert(err.message);
				}
			});

			document.getElementById('refreshBtn').addEventListener('click', async () => {
				try {
					await loadDocuments();
					await loadTemplates();
				} catch (err) {
					alert(err.message);
				}
			});

			document.getElementById('categoryFilter').addEventListener('change', async () => {
				currentPage = 1;
				await loadDocuments();
			});

			document.getElementById('perPage').addEventListener('change', async () => {
				currentPage = 1;
				await loadDocuments();
			});
		}

		document.addEventListener('DOMContentLoaded', async () => {
			wireEvents();
			try {
				await loadDocuments();
				await loadTemplates();
			} catch (err) {
				alert(err.message);
			}
		});
	</script>
    <script src="/static/topbar-global.js"></script>

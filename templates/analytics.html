<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhatsApp CRM - Raporlar</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.2/dist/chart.umd.min.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Inter"', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            50: '#f5f3ff',
                            100: '#ede9fe',
                            500: '#8b5cf6',
                            600: '#7c3aed',
                            900: '#4c1d95',
                        }
                    }
                }
            }
        }
    </script>
</head>

<body class="bg-slate-50 text-slate-800 h-screen overflow-hidden flex font-sans antialiased">
    <!-- Sidebar -->
    <aside class="w-16 bg-white border-r border-slate-200 flex flex-col items-center py-6 z-30 relative shadow-sm flex-shrink-0">
        <a href="/" class="w-10 h-10 bg-brand-600 rounded-xl flex items-center justify-center text-white text-xl shadow-lg mb-8 hover:scale-105 transition-transform" title="Ana Sayfa">
            <i class="fab fa-whatsapp"></i>
        </a>
        <nav class="flex-1 flex flex-col gap-4 w-full px-3">
            <a href="/" class="w-10 h-10 flex items-center justify-center text-slate-400 hover:text-brand-600 hover:bg-brand-50 rounded-xl transition-all" title="Gelen Kutusu">
                <i class="fas fa-inbox text-lg"></i>
            </a>
            <a href="/analytics" class="w-10 h-10 flex items-center justify-center text-brand-600 bg-brand-50 rounded-xl shadow-sm transition-all" title="Raporlar">
                <i class="fas fa-chart-line text-lg"></i>
            </a>
            <a href="/contacts" class="w-10 h-10 flex items-center justify-center text-slate-400 hover:text-brand-600 hover:bg-brand-50 rounded-xl transition-all" title="Kişiler">
                <i class="fas fa-address-book text-lg"></i>
            </a>
            <a href="/companies" class="w-10 h-10 flex items-center justify-center text-slate-400 hover:text-brand-600 hover:bg-brand-50 rounded-xl transition-all" title="Şirketler">
                <i class="fas fa-building text-lg"></i>
            </a>
            <a href="/broadcast" class="w-10 h-10 flex items-center justify-center text-slate-400 hover:text-brand-600 hover:bg-brand-50 rounded-xl transition-all" title="Toplu Mesaj">
                <i class="fas fa-bullhorn text-lg"></i>
            </a>
            <a href="/automation" class="w-10 h-10 flex items-center justify-center text-slate-400 hover:text-brand-600 hover:bg-brand-50 rounded-xl transition-all" title="Otomasyon">
                <i class="fas fa-robot text-lg"></i>
            </a>
            <a href="/pipeline" class="w-10 h-10 flex items-center justify-center text-slate-400 hover:text-brand-600 hover:bg-brand-50 rounded-xl transition-all" title="Pipeline">
                <i class="fas fa-chart-line text-lg"></i>
            </a>
            <a href="/tasks" class="w-10 h-10 flex items-center justify-center text-slate-400 hover:text-brand-600 hover:bg-brand-50 rounded-xl transition-all" title="Görevler">
                <i class="fas fa-list-check text-lg"></i>
            </a>
            <a href="/channels" class="w-10 h-10 flex items-center justify-center text-slate-400 hover:text-brand-600 hover:bg-brand-50 rounded-xl transition-all" title="Kanallar">
                <i class="fas fa-plug text-lg"></i>
            </a>
            <a href="/settings" class="w-10 h-10 flex items-center justify-center text-slate-400 hover:text-brand-600 hover:bg-brand-50 rounded-xl transition-all" title="Ayarlar">
                <i class="fas fa-cog text-lg"></i>
            </a>
        </nav>
        <div class="flex flex-col gap-4 w-full px-3 pb-4">
            <a href="/logout" class="w-10 h-10 flex items-center justify-center text-slate-400 hover:text-red-500 hover:bg-red-50 rounded-xl transition-all" title="Çıkış Yap">
                <i class="fas fa-sign-out-alt text-lg"></i>
            </a>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 flex flex-col overflow-hidden">
        <!-- Top Bar -->
        <header class="h-16 bg-white border-b border-slate-200 px-8 flex items-center justify-between z-20 flex-shrink-0">
            <div>
                <h1 class="text-xl font-bold text-slate-800">Analiz & Raporlar</h1>
            </div>
            <div class="flex items-center gap-3">
                <div id="lastUpdated" class="text-xs font-semibold text-slate-400 flex items-center gap-2">
                    <span class="w-2 h-2 rounded-full bg-emerald-500"></span>
                    Canlı Veri
                </div>
                <button onclick="loadAnalytics()" class="p-2 text-slate-400 hover:text-brand-600 hover:bg-brand-50 rounded-lg transition-colors">
                    <i class="fas fa-sync-alt"></i>
                </button>
            </div>
        </header>

        <div class="flex-1 overflow-y-auto p-8 space-y-8">
            <!-- KPI Grid -->
            <div id="kpiGrid" class="grid grid-cols-2 md:grid-cols-4 gap-4">
                <!-- Loading State -->
                <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm animate-pulse h-24"></div>
                <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm animate-pulse h-24"></div>
                <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm animate-pulse h-24"></div>
                <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm animate-pulse h-24"></div>
            </div>

            <!-- Charts Row 1 -->
            <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                <div class="lg:col-span-2 bg-white p-6 rounded-2xl border border-slate-200 shadow-sm">
                    <div class="flex items-center justify-between mb-6">
                        <h2 class="text-sm font-bold text-slate-800 uppercase tracking-wider">Gelir Trendi</h2>
                        <div class="flex items-center gap-4">
                            <div class="flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-full bg-brand-500"></span><span class="text-[10px] font-bold text-slate-500 uppercase">Gelir</span></div>
                        </div>
                    </div>
                    <div class="relative h-64">
                        <canvas id="trendChart"></canvas>
                    </div>
                </div>

                <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm">
                    <h2 class="text-sm font-bold text-slate-800 uppercase tracking-wider mb-6">Kazanma/Kaybetme Oranı</h2>
                    <div class="relative h-64">
                        <canvas id="winLossChart"></canvas>
                    </div>
                </div>
            </div>

            <!-- Charts Row 2 -->
            <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm">
                    <h2 class="text-sm font-bold text-slate-800 uppercase tracking-wider mb-6">Pipeline Dağılımı</h2>
                    <div class="relative h-64">
                        <canvas id="pipelineChart"></canvas>
                    </div>
                </div>

                <div class="lg:col-span-2 bg-white p-6 rounded-2xl border border-slate-200 shadow-sm">
                    <h2 class="text-sm font-bold text-slate-800 uppercase tracking-wider mb-6">En İyi Performans Gösterenler</h2>
                    <div id="agentTable" class="overflow-x-auto">
                        <!-- Dynamic -->
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script>
        const API = '/api/analytics';
        let trendChart, winLossChart, pipelineChart;

        function kpiCardHTML(icon, label, value, sub, subClass, iconColor) {
            return `
                <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm">
                    <div class="flex items-start justify-between mb-2">
                        <div class="w-10 h-10 rounded-lg bg-slate-50 flex items-center justify-center border border-slate-100">
                            <i class="${icon} ${iconColor} text-sm"></i>
                        </div>
                        ${sub ? `<span class="text-[10px] ${subClass} font-bold px-1.5 py-0.5 rounded-md bg-slate-50 border border-slate-100">${sub}</span>` : ''}
                    </div>
                    <div class="text-2xl font-bold text-slate-800">${value.toLocaleString('tr-TR')}</div>
                    <div class="text-[10px] text-slate-400 font-bold uppercase tracking-wider mt-0.5">${label}</div>
                </div>`;
        }

        function renderKPIs(kpis) {
            const cards = [
                kpiCardHTML('fas fa-dollar-sign', 'Toplam Gelir', kpis.total_revenue || 0, null, '', 'text-emerald-600'),
                kpiCardHTML('fas fa-chart-line', 'Açık Fırsatlar', kpis.open_opportunities || 0, null, '', 'text-brand-600'),
                kpiCardHTML('fas fa-users', 'Toplam Kişi', kpis.total_contacts || 0, null, '', 'text-indigo-500'),
                kpiCardHTML('fas fa-tasks', 'Tamamlanan Görevler', kpis.completed_tasks || 0, null, '', 'text-sky-500'),
            ];
            document.getElementById('kpiGrid').innerHTML = cards.join('');
        }

        function renderTrendChart(trend) {
            if (!trend || !trend.length) return;
            const labels = trend.map(d => d.period);
            const ctx = document.getElementById('trendChart').getContext('2d');
            if (trendChart) trendChart.destroy();
            trendChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels,
                    datasets: [
                        { 
                            label: 'Gelir', 
                            data: trend.map(d => d.revenue), 
                            borderColor: '#8b5cf6', 
                            backgroundColor: 'rgba(139,92,246,.05)', 
                            fill: true, 
                            tension: 0.4, 
                            pointRadius: 3,
                            pointBackgroundColor: '#8b5cf6',
                            borderWidth: 2 
                        }
                    ]
                },
                options: {
                    responsive: true, 
                    maintainAspectRatio: false,
                    plugins: { 
                        legend: { display: false }, 
                        tooltip: { backgroundColor: '#1e293b', padding: 12, cornerRadius: 8 } 
                    },
                    scales: {
                        x: { grid: { display: false }, ticks: { font: { size: 9, weight: 'bold' }, color: '#94a3b8' } },
                        y: { grid: { color: '#f1f5f9' }, ticks: { font: { size: 9, weight: 'bold' }, color: '#94a3b8' }, beginAtZero: true }
                    }
                }
            });
        }

        function renderWinLossChart(data) {
            if (!data) return;
            const ctx = document.getElementById('winLossChart').getContext('2d');
            if (winLossChart) winLossChart.destroy();
            winLossChart = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: ['Kazanılan', 'Kaybedilen'],
                    datasets: [{
                        data: [data.won_count || 0, data.lost_count || 0],
                        backgroundColor: ['#34d399', '#f87171'],
                        borderWidth: 0,
                        hoverOffset: 10
                    }]
                },
                options: {
                    responsive: true, 
                    maintainAspectRatio: false,
                    cutout: '70%',
                    plugins: {
                        legend: { 
                            position: 'bottom', 
                            labels: { 
                                font: { size: 9, weight: 'bold' }, 
                                color: '#64748b', 
                                padding: 15, 
                                usePointStyle: true 
                            } 
                        },
                        tooltip: { backgroundColor: '#1e293b', padding: 12, cornerRadius: 8 }
                    }
                }
            });
        }

        function renderPipelineChart(pipeline) {
            if (!pipeline || !pipeline.length) return;
            const ctx = document.getElementById('pipelineChart').getContext('2d');
            if (pipelineChart) pipelineChart.destroy();
            pipelineChart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: pipeline.map(d => d.stage),
                    datasets: [{ 
                        label: 'Toplam Değer', 
                        data: pipeline.map(d => d.total_value), 
                        backgroundColor: '#8b5cf6', 
                        borderRadius: 4 
                    }]
                },
                options: {
                    responsive: true, 
                    maintainAspectRatio: false,
                    plugins: { 
                        legend: { display: false }, 
                        tooltip: { backgroundColor: '#1e293b', padding: 12, cornerRadius: 8 } 
                    },
                    scales: {
                        x: { grid: { display: false }, ticks: { font: { size: 9, weight: 'bold' }, color: '#94a3b8' } },
                        y: { grid: { color: '#f1f5f9' }, ticks: { font: { size: 9, weight: 'bold' }, color: '#94a3b8' }, beginAtZero: true }
                    }
                }
            });
        }

        function renderTopPerformers(performers) {
            const el = document.getElementById('agentTable');
            if (!performers || !performers.length) { 
                el.innerHTML = `<p class="text-center text-slate-400 py-12 font-bold uppercase text-[10px] tracking-widest">Veri Yok</p>`; 
                return; 
            }
            
            const rows = performers.map(performer => {
                return `
                    <tr class="hover:bg-slate-50 transition-colors">
                        <td class="py-4 px-2">
                            <div class="flex items-center gap-2.5">
                                <div class="w-8 h-8 rounded-lg bg-brand-50 text-brand-600 flex items-center justify-center font-bold text-xs">${performer.user_name.charAt(0).toUpperCase()}</div>
                                <div>
                                    <p class="text-sm font-semibold text-slate-800">${performer.user_name}</p>
                                </div>
                            </div>
                        </td>
                        <td class="py-4 px-2 text-center text-sm font-bold text-slate-600">${performer.deal_count || 0}</td>
                        <td class="py-4 px-2 text-center text-sm font-bold text-emerald-600">${(performer.total_value || 0).toLocaleString('tr-TR')} ₺</td>
                    </tr>`;
            }).join('');

            el.innerHTML = `
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="border-b border-slate-100">
                            <th class="text-[10px] font-bold text-slate-400 uppercase tracking-widest pb-3 px-2">Kullanıcı</th>
                            <th class="text-[10px] font-bold text-slate-400 uppercase tracking-widest pb-3 px-2 text-center">Fırsat Sayısı</th>
                            <th class="text-[10px] font-bold text-slate-400 uppercase tracking-widest pb-3 px-2 text-center">Toplam Değer</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-slate-50">${rows}</tbody>
                </table>`;
        }

        async function loadAnalytics() {
            try {
                // Load KPIs
                const kpisRes = await fetch(`${API}/kpis`);
                const kpis = await kpisRes.json();
                renderKPIs(kpis);

                // Load Revenue Trend
                const trendRes = await fetch(`${API}/revenue-trend?days=30`);
                const trend = await trendRes.json();
                renderTrendChart(trend);

                // Load Win/Loss Ratio
                const winLossRes = await fetch(`${API}/win-loss-ratio`);
                const winLoss = await winLossRes.json();
                renderWinLossChart(winLoss);

                // Load Pipeline Distribution
                const pipelineRes = await fetch(`${API}/pipeline-distribution`);
                const pipeline = await pipelineRes.json();
                renderPipelineChart(pipeline);

                // Load Top Performers
                const performersRes = await fetch(`${API}/top-performers?limit=5`);
                const performers = await performersRes.json();
                renderTopPerformers(performers);
            } catch (e) { 
                console.error('Analytics load error', e); 
            }
        }

        document.addEventListener('DOMContentLoaded', loadAnalytics);
    </script>
</body>

</html>

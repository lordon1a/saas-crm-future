<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhatsApp CRM - Raporlar</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.2/dist/chart.umd.min.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Inter"', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            50: '#f5f3ff',
                            100: '#ede9fe',
                            500: '#8b5cf6',
                            600: '#7c3aed',
                            900: '#4c1d95',
                        }
                    }
                }
            }
        }
    </script>
</head>

<body class="bg-slate-50 text-slate-800 h-screen overflow-hidden flex font-sans antialiased">
    <!-- Sidebar -->
    <aside class="w-16 bg-white border-r border-slate-200 flex flex-col items-center py-6 z-30 relative shadow-sm flex-shrink-0">
        <a href="/" class="w-10 h-10 bg-brand-600 rounded-xl flex items-center justify-center text-white text-xl shadow-lg mb-8 hover:scale-105 transition-transform" title="Ana Sayfa">
            <i class="fab fa-whatsapp"></i>
        </a>
        <nav class="flex-1 flex flex-col gap-4 w-full px-3">
            <a href="/" class="w-10 h-10 flex items-center justify-center text-slate-400 hover:text-brand-600 hover:bg-brand-50 rounded-xl transition-all" title="Gelen Kutusu">
                <i class="fas fa-inbox text-lg"></i>
            </a>
            <a href="/analytics" class="w-10 h-10 flex items-center justify-center text-brand-600 bg-brand-50 rounded-xl shadow-sm transition-all" title="Raporlar">
                <i class="fas fa-chart-line text-lg"></i>
            </a>
            <a href="/contacts" class="w-10 h-10 flex items-center justify-center text-slate-400 hover:text-brand-600 hover:bg-brand-50 rounded-xl transition-all" title="Kişiler">
                <i class="fas fa-address-book text-lg"></i>
            </a>
            <a href="/companies" class="w-10 h-10 flex items-center justify-center text-slate-400 hover:text-brand-600 hover:bg-brand-50 rounded-xl transition-all" title="Şirketler">
                <i class="fas fa-building text-lg"></i>
            </a>
            <a href="/broadcast" class="w-10 h-10 flex items-center justify-center text-slate-400 hover:text-brand-600 hover:bg-brand-50 rounded-xl transition-all" title="Toplu Mesaj">
                <i class="fas fa-bullhorn text-lg"></i>
            </a>
            <a href="/automation" class="w-10 h-10 flex items-center justify-center text-slate-400 hover:text-brand-600 hover:bg-brand-50 rounded-xl transition-all" title="Otomasyon">
                <i class="fas fa-robot text-lg"></i>
            </a>
            <a href="/pipeline" class="w-10 h-10 flex items-center justify-center text-slate-400 hover:text-brand-600 hover:bg-brand-50 rounded-xl transition-all" title="Pipeline">
                <i class="fas fa-chart-line text-lg"></i>
            </a>
            <a href="/tasks" class="w-10 h-10 flex items-center justify-center text-slate-400 hover:text-brand-600 hover:bg-brand-50 rounded-xl transition-all" title="Görevler">
                <i class="fas fa-list-check text-lg"></i>
            </a>
            <a href="/channels" class="w-10 h-10 flex items-center justify-center text-slate-400 hover:text-brand-600 hover:bg-brand-50 rounded-xl transition-all" title="Kanallar">
                <i class="fas fa-plug text-lg"></i>
            </a>
            <a href="/settings" class="w-10 h-10 flex items-center justify-center text-slate-400 hover:text-brand-600 hover:bg-brand-50 rounded-xl transition-all" title="Ayarlar">
                <i class="fas fa-cog text-lg"></i>
            </a>
        </nav>
        <div class="flex flex-col gap-4 w-full px-3 pb-4">
            <a href="/logout" class="w-10 h-10 flex items-center justify-center text-slate-400 hover:text-red-500 hover:bg-red-50 rounded-xl transition-all" title="Çıkış Yap">
                <i class="fas fa-sign-out-alt text-lg"></i>
            </a>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 flex flex-col overflow-hidden">
        <!-- Top Bar -->
        <header class="h-16 bg-white border-b border-slate-200 px-8 flex items-center justify-between z-20 flex-shrink-0">
            <div>
                <h1 class="text-xl font-bold text-slate-800">Analiz & Raporlar</h1>
            </div>
            <div class="flex items-center gap-3">
                <div id="lastUpdated" class="text-xs font-semibold text-slate-400 flex items-center gap-2">
                    <span class="w-2 h-2 rounded-full bg-emerald-500"></span>
                    Canlı Veri
                </div>
                <button onclick="loadAnalytics()" class="p-2 text-slate-400 hover:text-brand-600 hover:bg-brand-50 rounded-lg transition-colors">
                    <i class="fas fa-sync-alt"></i>
                </button>
            </div>
        </header>

        <div class="flex-1 overflow-y-auto p-8 space-y-8">
            <!-- KPI Grid -->
            <div id="kpiGrid" class="grid grid-cols-2 md:grid-cols-4 gap-4">
                <!-- Loading State -->
                <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm animate-pulse h-24"></div>
                <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm animate-pulse h-24"></div>
                <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm animate-pulse h-24"></div>
                <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm animate-pulse h-24"></div>
            </div>

            <!-- Charts Row 1 -->
            <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                <div class="lg:col-span-2 bg-white p-6 rounded-2xl border border-slate-200 shadow-sm">
                    <div class="flex items-center justify-between mb-6">
                        <h2 class="text-sm font-bold text-slate-800 uppercase tracking-wider">Konuşma & Mesaj Trendi</h2>
                        <div class="flex items-center gap-4">
                            <div class="flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-full bg-brand-500"></span><span class="text-[10px] font-bold text-slate-500 uppercase">Konuşmalar</span></div>
                            <div class="flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-full bg-emerald-400"></span><span class="text-[10px] font-bold text-slate-500 uppercase">Mesajlar</span></div>
                        </div>
                    </div>
                    <div class="relative h-64">
                        <canvas id="trendChart"></canvas>
                    </div>
                </div>

                <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm">
                    <h2 class="text-sm font-bold text-slate-800 uppercase tracking-wider mb-6">Etiket Dağılımı</h2>
                    <div class="relative h-64">
                        <canvas id="tagChart"></canvas>
                    </div>
                </div>
            </div>

            <!-- Charts Row 2 -->
            <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm">
                    <h2 class="text-sm font-bold text-slate-800 uppercase tracking-wider mb-6">Müşteri Büyümesi</h2>
                    <div class="relative h-64">
                        <canvas id="customerChart"></canvas>
                    </div>
                </div>

                <div class="lg:col-span-2 bg-white p-6 rounded-2xl border border-slate-200 shadow-sm">
                    <h2 class="text-sm font-bold text-slate-800 uppercase tracking-wider mb-6">Temsilci Performansı</h2>
                    <div id="agentTable" class="overflow-x-auto">
                        <!-- Dynamic -->
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script>
        const API = '/api';
        let trendChart, tagChart, customerChart;

        const TAG_LABELS = {
            yeni_siparis: { label: 'Yeni Sipariş', color: '#fbbf24' },
            kargo_sorunu: { label: 'Kargo Sorunu', color: '#a78bfa' },
            odeme_bekliyor: { label: 'Ödeme Bekliyor', color: '#f87171' },
            kargolandi: { label: 'Kargolandı', color: '#34d399' },
        };

        function kpiCardHTML(icon, label, value, sub, subClass, iconColor) {
            return `
                <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm">
                    <div class="flex items-start justify-between mb-2">
                        <div class="w-10 h-10 rounded-lg bg-slate-50 flex items-center justify-center border border-slate-100">
                            <i class="${icon} ${iconColor} text-sm"></i>
                        </div>
                        ${sub ? `<span class="text-[10px] ${subClass} font-bold px-1.5 py-0.5 rounded-md bg-slate-50 border border-slate-100">${sub}</span>` : ''}
                    </div>
                    <div class="text-2xl font-bold text-slate-800">${value.toLocaleString('tr-TR')}</div>
                    <div class="text-[10px] text-slate-400 font-bold uppercase tracking-wider mt-0.5">${label}</div>
                </div>`;
        }

        function weekTrend(current, last) {
            if (last === 0) return ['', 'text-slate-400'];
            const pct = Math.round(((current - last) / last) * 100);
            if (pct > 0) return [`+${pct}%`, 'text-emerald-500'];
            if (pct < 0) return [`${pct}%`, 'text-red-500'];
            return ['—', 'text-slate-400'];
        }

        function renderKPIs(kpis) {
            const [wTrendText, wTrendClass] = weekTrend(kpis.this_week_conversations, kpis.last_week_conversations);
            const cards = [
                kpiCardHTML('fas fa-comments', 'Toplam Konuşma', kpis.total_conversations, wTrendText, wTrendClass, 'text-brand-600'),
                kpiCardHTML('fas fa-envelope-open', 'Açık Konuşma', kpis.open_conversations, kpis.open_conversations > 0 ? 'Aktif' : null, 'text-emerald-500', 'text-sky-500'),
                kpiCardHTML('fas fa-check-double', 'Kapatılan', kpis.closed_conversations, null, '', 'text-emerald-500'),
                kpiCardHTML('fas fa-users', 'Müşteriler', kpis.total_customers, null, '', 'text-indigo-500'),
                kpiCardHTML('fas fa-paper-plane', 'Toplam Mesaj', kpis.total_messages, null, '', 'text-brand-600'),
                kpiCardHTML('fas fa-clock', 'Bekleyen', kpis.pending_conversations, null, '', 'text-amber-500'),
                kpiCardHTML('fas fa-calendar-day', "Bugün", kpis.today_conversations, kpis.today_conversations > 0 ? `+${kpis.today_conversations}` : null, 'text-emerald-500', 'text-rose-500'),
                kpiCardHTML('fas fa-bolt', "Bugünkü Mesaj", kpis.today_messages, null, '', 'text-teal-500'),
            ];
            document.getElementById('kpiGrid').innerHTML = cards.join('');
        }

        function renderTrendChart(trend) {
            const labels = trend.map(d => d.date);
            const ctx = document.getElementById('trendChart').getContext('2d');
            if (trendChart) trendChart.destroy();
            trendChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels,
                    datasets: [
                        { label: 'Konuşmalar', data: trend.map(d => d.conversations), borderColor: '#8b5cf6', backgroundColor: 'rgba(139,92,246,.05)', fill: true, tension: 0.4, pointRadius: 0, borderWidth: 2 },
                        { label: 'Mesajlar', data: trend.map(d => d.messages), borderColor: '#34d399', backgroundColor: 'rgba(52,211,153,.05)', fill: true, tension: 0.4, pointRadius: 0, borderWidth: 2, yAxisID: 'y1' }
                    ]
                },
                options: {
                    responsive: true, maintainAspectRatio: false,
                    plugins: { legend: { display: false }, tooltip: { backgroundColor: '#1e293b', padding: 12, cornerRadius: 8 } },
                    scales: {
                        x: { grid: { display: false }, ticks: { font: { size: 9, weight: 'bold' }, color: '#94a3b8' } },
                        y: { grid: { color: '#f1f5f9' }, ticks: { font: { size: 9, weight: 'bold' }, color: '#94a3b8' }, beginAtZero: true },
                        y1: { position: 'right', grid: { display: false }, ticks: { font: { size: 9, weight: 'bold' }, color: '#94a3b8' }, beginAtZero: true }
                    }
                }
            });
        }

        function renderTagChart(tags) {
            const ctx = document.getElementById('tagChart').getContext('2d');
            if (tagChart) tagChart.destroy();
            tagChart = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: tags.map(t => (TAG_LABELS[t.tag] || {}).label || t.tag),
                    datasets: [{
                        data: tags.map(t => t.count),
                        backgroundColor: tags.map(t => (TAG_LABELS[t.tag] || {}).color || '#94a3b8'),
                        borderWidth: 0,
                        hoverOffset: 10
                    }]
                },
                options: {
                    responsive: true, maintainAspectRatio: false,
                    cutout: '70%',
                    plugins: {
                        legend: { position: 'bottom', labels: { font: { size: 9, weight: 'bold' }, color: '#64748b', padding: 15, usePointStyle: true } },
                        tooltip: { backgroundColor: '#1e293b', padding: 12, cornerRadius: 8 }
                    }
                }
            });
        }

        function renderCustomerChart(customerTrend) {
            const ctx = document.getElementById('customerChart').getContext('2d');
            if (customerChart) customerChart.destroy();
            customerChart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: customerTrend.map(d => d.date),
                    datasets: [{ label: 'Yeni Müşteri', data: customerTrend.map(d => d.count), backgroundColor: '#8b5cf6', borderRadius: 4 }]
                },
                options: {
                    responsive: true, maintainAspectRatio: false,
                    plugins: { legend: { display: false }, tooltip: { backgroundColor: '#1e293b', padding: 12, cornerRadius: 8 } },
                    scales: {
                        x: { grid: { display: false }, ticks: { font: { size: 9, weight: 'bold' }, color: '#94a3b8', maxTicksLimit: 7 } },
                        y: { grid: { color: '#f1f5f9' }, ticks: { font: { size: 9, weight: 'bold' }, color: '#94a3b8', stepSize: 1 }, beginAtZero: true }
                    }
                }
            });
        }

        function renderAgentTable(agents) {
            const el = document.getElementById('agentTable');
            if (!agents.length) { el.innerHTML = `<p class="text-center text-slate-400 py-12 font-bold uppercase text-[10px] tracking-widest">Veri Yok</p>`; return; }
            const rows = agents.map(agent => {
                const ratio = agent.total ? Math.round((agent.closed / agent.total) * 100) : 0;
                return `
                    <tr class="hover:bg-slate-50 transition-colors">
                        <td class="py-4 px-2">
                            <div class="flex items-center gap-2.5">
                                <div class="w-8 h-8 rounded-lg bg-brand-50 text-brand-600 flex items-center justify-center font-bold text-xs">${agent.name.charAt(0).toUpperCase()}</div>
                                <div><p class="text-sm font-semibold text-slate-800">${agent.name}</p><p class="text-[9px] font-bold text-slate-400 uppercase tracking-wider">${agent.role}</p></div>
                            </div>
                        </td>
                        <td class="py-4 px-2 text-center text-sm font-bold text-slate-600">${agent.total}</td>
                        <td class="py-4 px-2 text-center text-sm font-bold text-emerald-600">${agent.closed}</td>
                        <td class="py-4 px-2 text-center">
                            <span class="px-1.5 py-0.5 rounded text-[10px] font-bold uppercase ${ratio >= 70 ? 'bg-emerald-50 text-emerald-600' : 'bg-amber-50 text-amber-600'}">${ratio}%</span>
                        </td>
                        <td class="py-4 px-2">
                            <div class="w-24 bg-slate-100 h-1 rounded-full"><div class="bg-brand-500 h-1 rounded-full" style="width:${ratio}%"></div></div>
                        </td>
                    </tr>`;
            }).join('');

            el.innerHTML = `
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="border-b border-slate-100">
                            <th class="text-[10px] font-bold text-slate-400 uppercase tracking-widest pb-3 px-2">Temsilci</th>
                            <th class="text-[10px] font-bold text-slate-400 uppercase tracking-widest pb-3 px-2 text-center">Atanan</th>
                            <th class="text-[10px] font-bold text-slate-400 uppercase tracking-widest pb-3 px-2 text-center">Kapatılan</th>
                            <th class="text-[10px] font-bold text-slate-400 uppercase tracking-widest pb-3 px-2 text-center">Oran</th>
                            <th class="text-[10px] font-bold text-slate-400 uppercase tracking-widest pb-3 px-2">Performans</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-slate-50">${rows}</tbody>
                </table>`;
        }

        async function loadAnalytics() {
            try {
                const res = await fetch(`${API}/analytics`);
                const data = await res.json();
                renderKPIs(data.kpis);
                renderTrendChart(data.trend);
                renderTagChart(data.tag_distribution);
                renderCustomerChart(data.customer_trend);
                renderAgentTable(data.agent_stats);
            } catch (e) { console.error('Analytics load error', e); }
        }

        document.addEventListener('DOMContentLoaded', loadAnalytics);
    </script>
</body>

</html>
